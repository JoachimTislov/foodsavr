# Secrets known to scripts/secrets/rotate.py. Unregistered names need --sink;
# register new secrets here instead. Never put values in this file.
# effort = how complex/time-consuming renewal is (low | high), not leak severity.
# groups = secrets stored close together; any leak rotates the whole group.
# public = true for values shipped in clients by design (not a leak when seen there).
# generate = "sync" mirrors a source file: change the source to actually rotate.

[secrets.FIREBASE_OPTIONS_B64]
# Firebase client config is compiled into every app build.
public = true
generate = "sync"
command = "base64 -w0 lib/firebase_options.dart"
effort = "low"
sinks = ["github"]
groups = ["firebase", "ci"]

[secrets.FIRESTORE_RULES_B64]
generate = "sync"
command = "base64 -w0 firestore.rules"
effort = "low"
sinks = ["github"]
groups = ["firebase", "ci"]

[secrets.FIREBASE_APP_ID_ANDROID]
# Embedded in the Android app via google-services.json.
public = true
generate = "manual"
effort = "high"
sinks = ["github"]
groups = ["firebase", "ci"]
hint = "Firebase console > Project settings > Android app ID (1:...:android:...)"

[secrets.FIREBASE_CLI_TOKEN]
generate = "manual"
effort = "high"
sinks = ["github"]
groups = ["firebase", "ci"]
hint = "Run `firebase login:ci --no-localhost` and paste the token"

[secrets.CODECOV_TOKEN]
generate = "manual"
effort = "high"
sinks = ["github"]
groups = ["ci"]
hint = "Codecov > repository settings > regenerate upload token"

[secrets.FACEBOOK_APP_ID]
# Compiled into the Android app and used by the web SDK.
public = true
generate = "manual"
effort = "high"
sinks = ["env", "github"]
groups = ["meta", "local-env"]
hint = "Run scripts/human/meta/create-app-credentials.sh (Meta for Developers > App settings > Basic > App ID)"

[secrets.FACEBOOK_CLIENT_TOKEN]
# Compiled into the Android app (facebook_client_token resource).
public = true
generate = "manual"
effort = "high"
sinks = ["env", "github"]
groups = ["meta", "local-env"]
hint = "Run scripts/human/meta/create-app-credentials.sh (App settings > Advanced > Client token)"

[secrets.FACEBOOK_APP_SECRET]
generate = "manual"
effort = "high"
sinks = ["env"]
groups = ["meta", "local-env"]
hint = "Run scripts/human/meta/create-app-credentials.sh; to rotate, scripts/human/meta/rotate-app-secret.sh; then scripts/setup/social_auth.sh"

[secrets.GOOGLE_WEB_CLIENT_SECRET]
generate = "manual"
effort = "high"
sinks = ["env"]
groups = ["local-env"]
hint = "Run scripts/human/google/create-web-client-secret.sh; to rotate, scripts/human/google/rotate-web-client-secret.sh; then scripts/setup/social_auth.sh"

[secrets.FEEDBACK_GITHUB_TOKEN]
public = false
generate = "manual"
effort = "high"
sinks = ["env"]
groups = ["feedback-runtime", "local-env"]
hint = "Install a dedicated GitHub App for the configured repository and supply a short-lived installation token to the worker only. No administration or merge bypass permission."

[secrets.FEEDBACK_AGENT_KEY]
public = false
generate = "random"
length = 64
alphabet = "hex"
effort = "low"
sinks = ["env"]
groups = ["feedback-runtime", "local-env"]
hint = "Share this signing key only with the trusted isolated agent gateway and feedback worker. Never expose it to Flutter or an agent sandbox."

[secrets.CLAUDE_CODE_OAUTH_TOKEN]
public = false
generate = "manual"
effort = "low"
sinks = ["github"]
groups = ["agent-ci"]
hint = "Harness subscription token, not an API key: run `claude setup-token`. Used only by the feedback-agent runner."

[secrets.FEEDBACK_GITHUB_APP_ID]
public = false
generate = "manual"
effort = "low"
sinks = ["env", "github"]
groups = ["feedback-runtime", "agent-ci", "local-env"]
hint = "GitHub App settings > General > App ID."

[secrets.FEEDBACK_GITHUB_APP_PRIVATE_KEY]
public = false
generate = "manual"
effort = "high"
sinks = ["env", "github"]
groups = ["feedback-runtime", "agent-ci", "local-env"]
hint = "GitHub App settings > Private keys. Supply the PEM to the feedback worker and the feedback-agent runner only. The App needs issues:write, actions:write (dispatch), contents:write + pull_requests:write (agent branches/draft PRs, minted only in the runner), and administration:read to verify review protections. No write administration or bypass permissions."

[secrets.FEEDBACK_OWNER_FIREBASE_UID]
# Binds the feedback dashboard superadmin; an identifier, but changing it moves ownership.
public = false
generate = "manual"
effort = "high"
sinks = ["env"]
groups = ["feedback-runtime", "local-env"]
hint = "Run scripts/human/feedback/create-superadmin.sh (Firebase console > Authentication > Users > your User UID)"

[secrets.FEEDBACK_OWNER_PRINCIPAL]
# Internal superadmin principal ID; rotating it orphans grants and audit history.
public = false
generate = "random"
length = 32
alphabet = "hex"
effort = "high"
sinks = ["env"]
groups = ["feedback-runtime", "local-env"]
hint = "Generated by scripts/human/feedback/create-superadmin.sh on first run; do not rotate unless the dashboard is re-bootstrapped"
