# Secrets known to scripts/secrets/rotate.py. Names not listed here still work
# (manual value, --sink targets). Never put values in this file.
# `groups` = secrets stored close together; rotate a group when any member may be exposed.

[secrets.FIREBASE_OPTIONS_B64]
generate = "command"
command = "base64 -w0 lib/firebase_options.dart"
cost = "cheap"
sinks = ["github"]
groups = ["firebase", "ci"]

[secrets.FIRESTORE_RULES_B64]
generate = "command"
command = "base64 -w0 firestore.rules"
cost = "cheap"
sinks = ["github"]
groups = ["firebase", "ci"]

[secrets.FIREBASE_APP_ID_ANDROID]
generate = "manual"
cost = "expensive"
sinks = ["github"]
groups = ["firebase", "ci"]
hint = "Firebase console > Project settings > Android app ID (1:...:android:...)"

[secrets.FIREBASE_CLI_TOKEN]
generate = "manual"
cost = "expensive"
sinks = ["github"]
groups = ["firebase", "ci"]
hint = "Run `firebase login:ci --no-localhost` and paste the token"

[secrets.CODECOV_TOKEN]
generate = "manual"
cost = "expensive"
sinks = ["github"]
groups = ["ci"]
hint = "Codecov > repository settings > regenerate upload token"
