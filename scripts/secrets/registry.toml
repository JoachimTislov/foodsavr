# Secrets known to scripts/secrets/rotate.py. Unregistered names need --sink;
# register new secrets here instead. Never put values in this file.
# effort = how complex/time-consuming renewal is (low | high), not leak severity.
# groups = secrets stored close together; any leak rotates the whole group.
# public = true for values shipped in clients by design (not a leak when seen there).
# generate = "sync" mirrors a source file: change the source to actually rotate.

[secrets.FIREBASE_APP_ID_ANDROID]
# Embedded in the Android app via google-services.json.
public = true
generate = "manual"
effort = "high"
sinks = ["github"]
groups = ["firebase", "ci"]
hint = "Android app ID (1:...:android:...) from https://console.firebase.google.com/ (Project settings)"

[secrets.FIREBASE_CLI_TOKEN]
generate = "manual"
effort = "high"
sinks = ["github"]
groups = ["firebase", "ci"]
hint = "Run scripts/human/firebase/login-cli-token.sh (firebase login:ci browser consent)"

[secrets.CODECOV_TOKEN]
generate = "manual"
effort = "high"
sinks = ["github"]
groups = ["ci"]
hint = "Run scripts/human/codecov/rotate-upload-token.sh (Codecov web UI regenerate)"

[secrets.CLAUDE_CODE_OAUTH_TOKEN]
# Harness token (Claude subscription, no API key) for the agent-implement provider step.
generate = "manual"
effort = "low"
sinks = ["github"]
groups = ["ci", "agents"]
hint = "Run scripts/human/agents/login-claude-runner.sh (wraps `claude setup-token`; valid for one year)"

[secrets.CODEX_AUTH_JSON_B64]
# Optional fallback harness login (ChatGPT plan). The runner and this machine
# share one refresh token: if either refreshes it, re-sync before the next run.
generate = "sync"
sync_file = "~/.codex/auth.json"
encode = "base64"
effort = "low"
sinks = ["github"]
groups = ["ci", "agents"]
hint = "Run scripts/human/agents/sync-codex-runner.sh (mirrors ~/.codex/auth.json after `codex login`)"

[secrets.AGENT_APP_ID]
# Numeric ID of the agent GitHub App; an identifier, not a credential.
public = true
generate = "manual"
effort = "low"
sinks = ["github"]
groups = ["ci", "agents", "github-app"]
hint = "Agent App ID from https://github.com/settings/apps (set by scripts/human/github/create-agent-app.sh --role agent)"

[secrets.AGENT_APP_PRIVATE_KEY]
# PEM private key the publish job uses to mint one-hour installation tokens.
generate = "manual"
validate = "github-app-key"
effort = "high"
sinks = ["github"]
groups = ["ci", "agents", "github-app"]
hint = "Create via scripts/human/github/create-agent-app.sh --role agent, or generate a private key at https://github.com/settings/apps and delete the old key"

[secrets.RELEASE_GATE_APP_ID]
# Numeric ID of the trusted release-gate GitHub App (merge-gate & channel promotion, ADR 0008).
public = true
generate = "manual"
effort = "low"
sinks = ["github"]
groups = ["ci", "github-app"]
hint = "Release-gate App ID from https://github.com/settings/apps (set by scripts/human/github/create-agent-app.sh --role release-gate)"

[secrets.RELEASE_GATE_APP_PRIVATE_KEY]
# PEM private key for the trusted release-gate GitHub App (replaces personal PAT MERGE_GATE_TOKEN, ADR 0008).
generate = "manual"
validate = "github-app-key"
effort = "high"
sinks = ["github"]
groups = ["ci", "github-app"]
hint = "Create via scripts/human/github/create-agent-app.sh --role release-gate, or generate a private key at https://github.com/settings/apps and delete the old key"

[secrets.FACEBOOK_APP_ID]
# Compiled into the Android app. Web uses the Firebase Facebook provider.
public = true
generate = "manual"
effort = "high"
sinks = ["env", "github"]
groups = ["meta", "local-env"]
hint = "Basic app ID from https://developers.facebook.com/apps/ (or run scripts/human/meta/create-app-credentials.sh)"

[secrets.FACEBOOK_CLIENT_TOKEN]
# Compiled into the Android app (facebook_client_token resource).
public = true
generate = "manual"
effort = "high"
sinks = ["env", "github"]
groups = ["meta", "local-env"]
hint = "Advanced client token from https://developers.facebook.com/apps/ (or run scripts/human/meta/create-app-credentials.sh)"

[secrets.FACEBOOK_APP_SECRET]
generate = "manual"
effort = "high"
sinks = ["env"]
groups = ["meta", "local-env"]
hint = "Run scripts/human/meta/create-app-credentials.sh; to rotate, scripts/human/meta/rotate-app-secret.sh; then scripts/setup/social_auth.sh"

[secrets.GOOGLE_WEB_CLIENT_SECRET]
generate = "manual"
effort = "high"
sinks = ["env"]
groups = ["local-env"]
hint = "Run scripts/human/google/create-web-client-secret.sh; to rotate, scripts/human/google/rotate-web-client-secret.sh; then scripts/setup/social_auth.sh"

[secrets.ROUTER_BASE_URL]
# Optional Jev (https://api.typesafe.ai/v1/systemone) or OpenAI-compatible decision router endpoint; non-secret URL.
public = true
generate = "manual"
effort = "low"
sinks = ["env", "github"]
groups = ["agents", "ci"]
hint = "HTTPS endpoint for the agent decision router (e.g. https://api.typesafe.ai/v1/systemone)"

[secrets.ROUTER_API_KEY]
generate = "manual"
effort = "low"
sinks = ["env", "github"]
groups = ["agents", "ci"]
hint = "API key for the agent decision router endpoint"

[secrets.ROUTER_MODEL]
# Optional decision model identifier for the agent router (not required for Jev systemone; preserved for future models); non-secret configuration.
public = true
generate = "manual"
effort = "low"
sinks = ["env", "github"]
groups = ["agents", "ci"]
hint = "Optional decision model ID for the agent router (omit for Jev systemone)"

[secrets.ANTIGRAVITY_OAUTH_TOKEN_B64]
# Base64-encoded ~/.gemini/antigravity-cli/antigravity-oauth-token for headless Antigravity (agy) CI runner.
generate = "sync"
sync_file = "~/.gemini/antigravity-cli/antigravity-oauth-token"
encode = "base64"
effort = "low"
sinks = ["github"]
groups = ["ci", "agents"]
hint = "Run scripts/human/agents/sync-antigravity-runner.sh (mirrors ~/.gemini/antigravity-cli/antigravity-oauth-token after `agy login`)"

[secrets.GEMINI_API_KEY]
# Optional Gemini API key for zero-harness-overhead Antigravity CLI (agy) execution in CI.
generate = "manual"
effort = "low"
sinks = ["env", "github"]
groups = ["ci", "agents"]
hint = "Optional Gemini API key for zero-harness-overhead Antigravity CLI (agy) execution in CI"

[secrets.REVENUECAT_GOOGLE_API_KEY]
# RevenueCat public SDK key for the Android (Play Billing) app; compiled into
# the app by design (ADR 0008). Not set yet: added by the RevenueCat slice.
public = true
generate = "manual"
effort = "low"
sinks = ["env", "github"]
groups = ["revenuecat", "local-env"]
hint = "Public Google Play API key (goog_...) from https://app.revenuecat.com/"

[secrets.REVENUECAT_WEB_API_KEY]
# RevenueCat public SDK key for RevenueCat Web Billing (Stripe); compiled into
# the web build by design (ADR 0008). Not set yet: added by the web billing slice.
public = true
generate = "manual"
effort = "low"
sinks = ["env", "github"]
groups = ["revenuecat", "local-env"]
hint = "Public Web Billing API key (rcb_...) from https://app.revenuecat.com/"


[secrets.WEB_ACCESS_CODE]
# Compiled into the hosted web client.
public = true
generate = "random"
length = 12
alphabet = "alnum"
effort = "low"
sinks = ["github-variable"]
groups = ["hosting"]
hint = "Redeploy Hosting after rotation so the new build picks up the repository variable."

[secrets.WEB_ENV_B64]
# The bundle is stored as a GitHub Actions secret. Hosting serves the decoded
# file publicly. Review the complete payload before each sync.
public = false
generate = "sync"
sync_file = "assets/.env"
encode = "base64"
effort = "high"
sinks = ["github"]
groups = ["hosting", "ci"]
hint = "Owner: review assets/.env against assets/.env.example before syncing public client configuration to Hosting."

# Bundled store integration keys are public client configuration.
# Each key has no independent write sink. WEB_ENV_B64 syncs the reviewed file.
# Source: lib/features/third_party_integration (clients, Provider and OAuth).

[secrets.REMA_API_SUB_KEY]
# FoodSavr's owner classified this as public client configuration because
# the subscription key is distributed in REMA's app (#358).
public = true
generate = "manual"
effort = "high"
sinks = []
groups = ["local-env", "hosting"]
hint = "REMA subscription key sent in the Ocp-Apim-Subscription-Key header."

