name: Format, Analyze, Check Localizations and Run Tests

on:
  push:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore committed analysis options
        run: git checkout -- analysis_options.yaml

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart

      - name: Create empty .env file
        run: touch assets/.env

      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings --no-pub

      - name: Localization check
        run: dart run scripts/locale/check_localizations.dart

      - name: Run tests
        run: |
          set +e
          flutter test --no-pub --coverage > test_output.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E '\[E\]' test_output.txt | head -8 > failed.txt || true
            while IFS= read -r line; do echo "::error title=test-failure::$line"; done < failed.txt
            grep -B2 -A12 '\[E\]' test_output.txt | head -c 650 > ctx.txt || true
            echo "::error title=test-ctx::$(cat ctx.txt | tr '\n' ';')"
          fi
          exit $code

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
