name: Format, Analyze, Check Localizations and Run Tests

on:
  push:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore committed analysis options
        run: git checkout -- analysis_options.yaml

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart

      - name: Create empty .env file
        run: touch assets/.env

      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings --no-pub

      - name: Localization check
        run: dart run scripts/locale/check_localizations.dart

      - name: Run tests
        run: |
          set +e
          flutter test --no-pub --coverage > test_output.txt 2>&1
          code=$?
          echo "::error title=diag-exit::exit=$code total-lines=$(wc -l < test_output.txt)"
          grep '::error' test_output.txt | head -4 > rep.txt || true
          while IFS= read -r line; do echo "::error title=rep::$(echo "$line" | head -c 220)"; done < rep.txt
          grep -iE 'fail|expected' test_output.txt | grep -v '::group' | head -3 > fail.txt || true
          while IFS= read -r line; do echo "::error title=fail::$(echo "$line" | head -c 200)"; done < fail.txt
          if [ $code -ne 0 ]; then
            git config user.name "ci-diag" && git config user.email "ci-diag@users.noreply.github.com"
            git fetch origin feature/issue-27-default-collections
            git checkout FETCH_HEAD
            cp test_output.txt .github/diag-test-output.txt
            git add .github/diag-test-output.txt
            git commit -m "ci(diagnostic): capture test run output"
            git push origin HEAD:feature/issue-27-default-collections
          fi
          exit $code
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
