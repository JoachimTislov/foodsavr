name: Format, Analyze, Check Localizations and Run Tests

on:
  push:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          echo "::error title=diag-dirty::$(git status --porcelain | head -c 600 | tr '\n' ';')"
          dart format --output=none . > fmt_report.txt 2>&1 || true
          echo "::error title=diag-count::$(tail -1 fmt_report.txt)"
          echo "::error title=diag-sha1::$(sha256sum test/inventory_visibility_test.dart | head -c 64)"
          echo "::error title=diag-sha2::$(sha256sum lib/views/dashboard_view.dart | head -c 64)"
          echo "::error title=diag-sha3::$(sha256sum analysis_options.yaml | head -c 64)"
          echo "::error title=diag-lscount::tracked $(git ls-files '*.dart' | wc -l) find $(find . -name '*.dart' -not -path './.git/*' | wc -l)"
          head -3 fmt_report.txt | while IFS= read -r line; do echo "::error title=diag-fmt::$line"; done
          dart format --output=none --set-exit-if-changed .
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart

      - name: Create empty .env file
        run: touch assets/.env

      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings --no-pub

      - name: Localization check
        run: dart run scripts/locale/check_localizations.dart

      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
