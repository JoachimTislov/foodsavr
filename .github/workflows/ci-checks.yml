name: Format, Analyze, Check Localizations and Run Tests

on:
  push:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore committed analysis options
        run: |
          git diff analysis_options.yaml | head -c 1400 > /tmp/ao_diff.txt || true
          split -b 700 /tmp/ao_diff.txt /tmp/ao_chunk_ || true
          for c in /tmp/ao_chunk_*; do echo "::error title=diag-ao::$(cat $c | tr '\n' ';')"; done
          git checkout -- analysis_options.yaml

      - name: Verify formatting
        run: |
          dart format --output=none . > fmt_report.txt 2>&1 || true
          echo "::error title=diag-tail::$(tail -1 fmt_report.txt)"
          head -4 fmt_report.txt | while IFS= read -r line; do echo "::error title=diag-fmt::$line"; done
          dart format --output=show test/inventory_visibility_test.dart > f.shown 2>/dev/null || true
          sed -i '$ d' f.shown || true
          echo "::error title=diag-diff::$(diff -u test/inventory_visibility_test.dart f.shown 2>&1 | head -c 650 | tr '\n' ';')"
          echo "::error title=diag-ao::$(sha256sum analysis_options.yaml | head -c 64)"
          dart format --output=none --set-exit-if-changed .
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart

      - name: Create empty .env file
        run: touch assets/.env

      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings --no-pub

      - name: Localization check
        run: dart run scripts/locale/check_localizations.dart

      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
