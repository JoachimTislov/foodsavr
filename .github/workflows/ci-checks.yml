name: Format, Analyze, Check Localizations and Run Tests

on:
  push:
    branches: [main]
    paths: &code_paths
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/translations/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - "web/**"
      - "integration_test/**"
      - "test_driver/**"
  pull_request:
    branches: [main]
    paths: *code_paths
  workflow_dispatch:

jobs:
  gate:
    name: Decide whether to run CI
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject=$(git log -1 --pretty=%s)
          parents=$(git show -s --format='%P' HEAD | wc -w)
          if [ "$parents" -gt 1 ] && echo "$subject" | grep -qE '^Merge pull request #[0-9]+'; then
            echo "HEAD is a GitHub PR merge; CI already ran on the pull request" >&2
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

  check:
    name: Check & Test
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore committed analysis options
        run: git checkout -- analysis_options.yaml

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart

      - name: Create empty .env file
        run: touch assets/.env

      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings --no-pub

      - name: Localization check
        run: dart run scripts/locale/check_localizations.dart

      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
