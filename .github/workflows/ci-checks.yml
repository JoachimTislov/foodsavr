name: Format, Analyze, Check Localizations and Run Tests

on:
  push:
    branches: [daily, weekly, stable]
    paths:
      - "**.dart"
      - "lib/**"
      - "packages/**"
      - "test/**"
      - "assets/**"
      - "scripts/ci/*.dart"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "integration_test/**"
      - "test_driver/**"
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Dependabot rebases keep the running check: the next run starts after it and
  # skips when the previous head was green and nothing in scope changed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}

jobs:
  gate:
    name: Decide whether to run CI
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      run_release: ${{ steps.decide.outputs.run_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Changed code paths (pull requests)
        id: paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - "**.dart"
              - "lib/**"
              - "packages/**"
              - "test/**"
              - "assets/**"
              - "scripts/ci/*.dart"
              - "pubspec.yaml"
              - "pubspec.lock"
              - "analysis_options.yaml"
              - "integration_test/**"
              - "test_driver/**"
            release:
              - "scripts/release/**"
              - ".github/workflows/build-android.yml"
              - ".github/workflows/android-drive-test.yml"
              - ".github/workflows/release-gated.yml"

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run_release=${{ steps.paths.outputs.release == 'true' }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_release=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ steps.paths.outputs.code }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          scripts/ci/already_tested.sh ci-checks.yml ':(glob)**/*.dart' lib packages test assets/translations pubspec.yaml pubspec.lock analysis_options.yaml integration_test test_driver
          if grep -q 'skip=true' "$GITHUB_OUTPUT"; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  release-scripts:
    name: Check release scripts
    needs: gate
    if: needs.gate.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run release script tests
        run: python3 scripts/ci/local_ci.py --group release

  check:
    name: Check & Test
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: 3.47.6
          run-pub-get: "false"
          run-build-runner: "false"

      - name: Install dependencies
        run: flutter pub get

      - name: Restore committed analysis options
        run: git checkout -- analysis_options.yaml

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Cache build_runner state
        uses: actions/cache@v4
        with:
          path: .dart_tool/build
          key: build-runner-${{ runner.os }}-3.47.6-${{ hashFiles('pubspec.lock', 'lib/**/*.dart', 'packages/**/*.dart') }}
          restore-keys: |
            build-runner-${{ runner.os }}-3.47.6-${{ hashFiles('pubspec.lock') }}-
            build-runner-${{ runner.os }}-3.47.6-

      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings --no-pub

      - name: Localization check
        run: dart run scripts/locale/check_localizations.dart

      - name: "Shape-sync check (ADR 0004)"
        run: dart run scripts/ci/check_shape_sync.dart

      - name: "Select tests (ADR 0002 relational selection + core pin)"
        id: select
        run: |
          set -o pipefail
          dart run scripts/ci/select_tests.dart | tee selection.txt
          echo "files=$(grep '^files=' selection.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "reason=$(grep '^reason=' selection.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Restore test hash cache
        uses: actions/cache@v4
        with:
          path: .test-hashes/
          key: test-hashes-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            test-hashes-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: "Run tests (selected slice incl. foodsavr_core package tests, cached-green skip, core workflows pinned)"
        run: dart run scripts/ci/run_tests.dart
        env:
          SELECTED_FILES: ${{ steps.select.outputs.files }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Upload coverage to Codecov
        if: hashFiles('coverage/lcov.info') != '' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Report skipped Codecov upload
        if: hashFiles('coverage/lcov.info') != '' && env.CODECOV_TOKEN == ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: echo '::warning::CODECOV_TOKEN is missing; coverage upload was skipped.'
