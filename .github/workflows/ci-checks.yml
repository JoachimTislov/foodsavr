name: Format, Analyze, Check Localizations and Run Tests

on:
  push:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          {
            echo "## Dart version"
            echo '```'
            dart --version
            echo '```'
            echo "## Git state"
            echo '```'
            git rev-parse HEAD
            git status --porcelain | head -50
            echo '```'
            echo "## Format report"
            echo '```'
            dart format --output=none . 2>&1
            echo '```'
            echo "## Diff sample"
            echo '```diff'
            dart format -o /tmp/fmtout test/inventory_visibility_test.dart lib/widgets/auth/auth_header.dart > /dev/null 2>&1
            diff -u test/inventory_visibility_test.dart /tmp/fmtout/test/inventory_visibility_test.dart | head -60
            diff -u lib/widgets/auth/auth_header.dart /tmp/fmtout/lib/widgets/auth/auth_header.dart | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          dart format --output=none --set-exit-if-changed .
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart

      - name: Create empty .env file
        run: touch assets/.env

      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings --no-pub

      - name: Localization check
        run: dart run scripts/locale/check_localizations.dart

      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
