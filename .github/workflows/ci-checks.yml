name: Format, Analyze, Check Localizations and Run Tests

on:
  push:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "pubspec.yaml"
  workflow_dispatch:

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: |
          echo "::error title=diag-version::$(dart --version 2>&1 | head -1)"
          echo "::error title=diag-whichdart::$(which dart)"
          echo "::error title=diag-flutter::$(flutter --version 2>&1 | head -2 | tr '\n' ';')"
          echo "::error title=diag-head::$(git rev-parse HEAD) $(git status --porcelain | wc -l) dirty"
          dart format --output=none . > fmt_report.txt 2>&1 || true
          head -6 fmt_report.txt | while IFS= read -r line; do echo "::error title=diag-fmt::$line"; done
          dart format --output=none --set-exit-if-changed .
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart

      - name: Create empty .env file
        run: touch assets/.env

      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings --no-pub

      - name: Localization check
        run: dart run scripts/locale/check_localizations.dart

      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true
