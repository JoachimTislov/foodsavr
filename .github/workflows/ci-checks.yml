name: Format, Analyze, Check Localizations and Run Tests

on:
  push:
    branches: [main]
    paths:
      - "**.dart"
      - "lib/**"
      - "test/**"
      - "assets/**"
      - "packages/**"
      - ".github/workflows/build-android.yml"
      - ".github/workflows/release-gated.yml"
      - "scripts/release/**"
      - "scripts/ci/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "android/**"
      - "web/**"
      - "integration_test/**"
      - "test_driver/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Decide whether to run CI
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Changed code paths (pull requests)
        id: paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - "**.dart"
              - "lib/**"
              - "test/**"
              - "assets/translations/**"
              - "pubspec.yaml"
              - "pubspec.lock"
              - "analysis_options.yaml"
              - "android/**"
              - "web/**"
              - "integration_test/**"
              - "test_driver/**"
              - "assets/**"
              - "packages/**"
              - ".github/workflows/build-android.yml"
              - ".github/workflows/android-drive-test.yml"
              - ".github/workflows/release-gated.yml"
              - "scripts/release/**"
              - "scripts/ci/**"

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ steps.paths.outputs.code }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          scripts/ci/already_tested.sh ci-checks.yml
          if grep -q 'skip=true' "$GITHUB_OUTPUT"; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  check:
    name: Check & Test
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: "stable"
          cache: true

      - name: Check Android release orchestration
        run: |
          node --test scripts/release/release_gate.test.cjs
          python3 -m unittest discover -s scripts/release -p '*_test.py'

      - name: Install dependencies
        run: flutter pub get

      - name: Restore committed analysis options
        run: git checkout -- analysis_options.yaml

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_B64: ${{ secrets.FIREBASE_OPTIONS_B64 }}
        run: bash scripts/ci/write_firebase_options.sh

      - name: Create empty .env file
        run: touch assets/.env

      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze --fatal-infos --fatal-warnings --no-pub

      - name: Localization check
        run: dart run scripts/locale/check_localizations.dart

      - name: "Shape-sync check (ADR 0004)"
        run: dart run scripts/ci/check_shape_sync.dart

      - name: "Select tests (ADR 0002 relational selection + core pin)"
        id: select
        run: |
          set -o pipefail
          dart run scripts/ci/select_tests.dart | tee selection.txt
          echo "files=$(grep '^files=' selection.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
          echo "reason=$(grep '^reason=' selection.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Restore test hash cache
        uses: actions/cache@v4
        with:
          path: .test-hashes/
          key: test-hashes-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            test-hashes-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}-

      - name: "Run tests (selected slice, cached-green skip, core workflows pinned)"
        run: dart run scripts/ci/run_tests.dart
        env:
          SELECTED_FILES: ${{ steps.select.outputs.files }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Upload coverage to Codecov
        if: hashFiles('coverage/lcov.info') != '' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Report skipped Codecov upload
        if: hashFiles('coverage/lcov.info') != '' && env.CODECOV_TOKEN == ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: echo '::warning::CODECOV_TOKEN is missing; coverage upload was skipped.'
