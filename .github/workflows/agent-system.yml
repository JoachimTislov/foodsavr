name: Agent system validation

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.gemini/**'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agent-implement.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'scripts/agents/**'
      - 'scripts/github/**'
      - 'scripts/secrets/**'
      - 'scripts/ci/local_ci.py'
      - 'scripts/ci/test_local_ci.py'
      - '.githooks/**'
      - 'scripts/human/**'
      - '.agents/github/**'
      - '.github/workflows/github-labels.yml'
      - '.github/workflows/merge-gate.yml'
      - 'specs/**'
      - 'docs/**'
      - 'doc/**'
      - '.github/workflows/agent-system.yml'
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - '.claude/**'
      - '.gemini/**'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agent-implement.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'scripts/agents/**'
      - 'scripts/github/**'
      - 'scripts/secrets/**'
      - 'scripts/ci/local_ci.py'
      - 'scripts/ci/test_local_ci.py'
      - '.githooks/**'
      - 'scripts/human/**'
      - '.agents/github/**'
      - '.github/workflows/github-labels.yml'
      - '.github/workflows/merge-gate.yml'
      - 'specs/**'
      - 'docs/**'
      - 'doc/**'
      - '.github/workflows/agent-system.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate agent CLI
        run: python3 scripts/ci/local_ci.py --group agents
      - name: Exercise declarative workflow lifecycle
        env:
          AGENT_LEDGER_FILE: ${{ runner.temp }}/agent-ledger.md
          AGENT_SESSION_INDEX: ${{ runner.temp }}/sessions.jsonl
          AGENT_KNOWLEDGE_DB: ${{ runner.temp }}/knowledge.sqlite3
        run: |
          cp .agents/ledger.md "$AGENT_LEDGER_FILE"
          scripts/agents/agentctl workflow run .agents/workflows/repository-health.json
          test -s "$AGENT_LEDGER_FILE"
      - name: Check generated state is ignored
        run: test -z "$(git status --porcelain)"
