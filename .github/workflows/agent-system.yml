name: Agent system validation

on:
  pull_request:
    branches: [develop]
    paths: &agent-paths
      - '.agents/**'
      - '.claude/**'
      - '.gemini/**'
      - '.github/agents/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/agent-implement.yml'
      - '.github/workflows/agent-review.yml'
      - 'log/**'
      - 'logs/**'
      - '**/*.jsonl'
      - '**/*.log'
      - '!.agents/events/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'scripts/agents/**'
      - 'scripts/github/**'
      - 'scripts/secrets/**'
      - 'scripts/monitoring/**'
      - 'scripts/ci/*.py'
      - '.githooks/**'
      - 'scripts/human/**'
      - 'scripts/setup/agent_router.sh'
      - 'scripts/setup/setupctl.py'
      - 'scripts/setup/test_*.py'
      - '.agents/github/**'
      - '.github/workflows/github-labels.yml'
      - '.github/workflows/merge-gate.yml'
      - '.github/workflows/promote.yml'
      - 'Makefile'
      - 'make/**'
      - 'scripts/web/**'
      - '.github/workflows/firebase-hosting.yml'
      - '.github/workflows/web-monitor.yml'
      - '.github/workflows/fault-intake.yml'
      - 'specs/**'
      - 'docs/**'
      - 'doc/**'
      - '.github/workflows/agent-system.yml'
  push:
    branches: [daily, weekly, stable]
    paths: *agent-paths
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate agent CLI
        run: python3 scripts/ci/local_ci.py --group agents
      - name: Exercise declarative workflow lifecycle
        env:
          AGENT_LEDGER_FILE: ${{ runner.temp }}/agent-ledger.jsonl
          AGENT_SESSION_INDEX: ${{ runner.temp }}/sessions.jsonl
          AGENT_KNOWLEDGE_DB: ${{ runner.temp }}/knowledge.sqlite3
        run: |
          cp .agents/ledger.jsonl "$AGENT_LEDGER_FILE"
          scripts/agents/agentctl workflow run .agents/workflows/repository-health.json
          test -s "$AGENT_LEDGER_FILE"
      - name: Check generated state is ignored
        run: test -z "$(git status --porcelain)"
