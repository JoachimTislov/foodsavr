name: Agent system validation

on:
  pull_request:
    paths:
      - '.agents/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'scripts/agents/**'
      - 'scripts/github/**'
      - '.agents/github/**'
      - '.github/workflows/github-labels.yml'
      - 'specs/**'
      - 'docs/**'
      - 'doc/**'
      - '.github/workflows/agent-system.yml'
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'scripts/agents/**'
      - 'scripts/github/**'
      - '.agents/github/**'
      - '.github/workflows/github-labels.yml'
      - 'specs/**'
      - 'docs/**'
      - 'doc/**'
      - '.github/workflows/agent-system.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate agent CLI
        run: |
          python3 -m py_compile scripts/agents/agentctl.py scripts/agents/session_query.py
          python3 -m unittest scripts/agents/test_agentctl.py
          python3 -m unittest scripts/github/test_sync_labels.py
          scripts/agents/agentctl maintain
          scripts/agents/agentctl workflow validate .agents/workflows/repository-health.json
          scripts/agents/agentctl router plan .agents/workflows/repository-health.json
          scripts/agents/agentctl doctor
          for provider in codex claude opencode gemini vibe copilot; do
            scripts/agents/agentctl policy compile --provider "$provider" >/dev/null
          done
          python3 -m json.tool .agents/policies/default.json >/dev/null
          python3 -m json.tool .agents/github/labels.json >/dev/null
          python3 -m json.tool .agents/policies/schema.json >/dev/null
          python3 -m json.tool .agents/runners/providers.json >/dev/null
          python3 -m json.tool .agents/runners/router.json >/dev/null
          python3 -m json.tool .agents/workflows/schema.json >/dev/null
          python3 -m json.tool .agents/workflows/result.schema.json >/dev/null
      - name: Check generated state is ignored
        run: test -z "$(git status --porcelain)"
