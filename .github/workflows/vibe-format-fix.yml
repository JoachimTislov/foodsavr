name: Vibe format diff

on:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: "stable"

      - name: Format and print diff
        run: |
          dart format .
          echo "=====FORMAT DIFF BEGIN====="
          git diff
          echo "=====FORMAT DIFF END====="
