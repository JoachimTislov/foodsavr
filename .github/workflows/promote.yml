name: Promote release channels

# Periodic and manual fast-forward promotions along the configured release
# topology (ADR 0007, ADR 0008, controlled by vars.RELEASE_TOPOLOGY):
#   single        — develop only (workflow cleanly no-ops)
#   two-stage     — develop -> stable (biweekly 1st & 15th 06:00 UTC or manual)
#   full-channels — develop -> daily (04:00 UTC) -> weekly (Mon 05:00 UTC)
#                   -> stable (1st & 15th 06:00 UTC)
#
# The script fetches only the branches each step needs; a missing channel
# branch is reported and skipped on schedule and fails a manual run. A missing
# gate token fails both (no silent green); `make promote` is the manual bypass.
#
# Never creates merge commits and never force-pushes. Pushing with the
# Release-Gate GitHub App token (or legacy MERGE_GATE_TOKEN) triggers
# downstream deployment workflows on `stable`.

on:
  schedule:
    # Daily cut: develop -> daily
    - cron: '0 4 * * *'
    # Weekly cut (Mondays): daily -> weekly
    - cron: '0 5 * * 1'
    # Stable production cut (1st & 15th): weekly -> stable
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      channel:
        description: "Target release channel to fast-forward"
        type: choice
        options: [daily, weekly, stable]
        default: stable
      source:
        description: "Source branch (default follows active RELEASE_TOPOLOGY)"
        type: choice
        options: [default, develop, daily, weekly]
        default: default
      dry_run:
        description: "Preview promotion without pushing"
        type: boolean
        default: false

concurrency:
  group: promote-release-channels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Fast-forward release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_TOPOLOGY: ${{ vars.RELEASE_TOPOLOGY || (github.repository == 'JoachimTislov/foodsavr' && 'full-channels' || 'single') }}
    steps:
      - name: Skip cleanly in single-branch topology
        if: env.RELEASE_TOPOLOGY == 'single'
        run: |
          echo "RELEASE_TOPOLOGY=single; no release channel promotions needed."
          echo "Skipped: RELEASE_TOPOLOGY=single (no channel promotion branches)." >> "$GITHUB_STEP_SUMMARY"

      - name: Check Release-Gate App configuration
        if: env.RELEASE_TOPOLOGY != 'single'
        id: app-config
        env:
          RELEASE_GATE_APP_ID: ${{ vars.RELEASE_GATE_APP_ID || secrets.RELEASE_GATE_APP_ID }}
          RELEASE_GATE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_GATE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$RELEASE_GATE_APP_ID" ] && [ -n "$RELEASE_GATE_APP_PRIVATE_KEY" ]; then
            if ! printf '%s\n' "$RELEASE_GATE_APP_PRIVATE_KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
              echo "::error::RELEASE_GATE_APP_PRIVATE_KEY is not a valid PEM private key. Re-upload the GitHub App .pem file with scripts/secrets/rotate.py RELEASE_GATE_APP_PRIVATE_KEY."
              exit 1
            fi
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint Release-Gate App token
        id: gate-app
        if: env.RELEASE_TOPOLOGY != 'single' && steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_GATE_APP_ID || secrets.RELEASE_GATE_APP_ID }}
          private-key: ${{ secrets.RELEASE_GATE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        if: env.RELEASE_TOPOLOGY != 'single'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Promote release channel (fast-forward only)
        if: env.RELEASE_TOPOLOGY != 'single'
        env:
          # Must not be GITHUB_TOKEN for --apply: its pushes trigger no deployment workflows.
          GATE_TOKEN: ${{ steps.gate-app.outputs.token || secrets.MERGE_GATE_TOKEN }}
          FALLBACK_READ_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          TARGET_CHANNEL: ${{ inputs.channel }}
          SOURCE_BRANCH: ${{ inputs.source }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--repo "${{ github.repository }}" --topology "$RELEASE_TOPOLOGY")
          if [ "$EVENT_NAME" = "schedule" ]; then
            args+=(--schedule "$SCHEDULE_CRON")
          else
            args+=(--target-branch "$TARGET_CHANNEL")
            if [ -n "$SOURCE_BRANCH" ] && [ "$SOURCE_BRANCH" != "default" ]; then
              args+=(--source-branch "$SOURCE_BRANCH")
            fi
          fi

          if [ "$DRY_RUN" != "true" ]; then
            if [ -z "$GATE_TOKEN" ]; then
              # Enabled (topology is not single) but unable to publish: fail instead of a silent green.
              echo "::error::Configure RELEASE_GATE_APP_ID/RELEASE_GATE_APP_PRIVATE_KEY (or legacy MERGE_GATE_TOKEN). Nothing was promoted. Promote now: make promote CHANNEL=<channel> APPLY=1."
              exit 1
            fi
            export GH_TOKEN="$GATE_TOKEN"
            args+=(--apply)
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              args+=(--strict-pending)
            fi
          else
            export GH_TOKEN="${GATE_TOKEN:-$FALLBACK_READ_TOKEN}"
          fi

          python3 scripts/github/promote_release.py "${args[@]}"
