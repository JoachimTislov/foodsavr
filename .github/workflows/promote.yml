name: Promote release channels

# Periodic and manual fast-forward promotions along the linear release pipeline
# (ADR 0007):
#   develop -> nightly (daily 04:00 UTC)
#   nightly -> beta    (weekly Mondays 05:00 UTC)
#   beta    -> stable -> release (biweekly 1st & 15th 06:00 UTC)
#
# Never creates merge commits and never force-pushes. Pushing with
# MERGE_GATE_TOKEN triggers downstream deployment workflows on `release`
# (Firebase Hosting, Release (Gated), Documentation Pages).

on:
  schedule:
    # Daily nightly cut: develop -> nightly
    - cron: '0 4 * * *'
    # Weekly beta cut (Mondays): nightly -> beta
    - cron: '0 5 * * 1'
    # Biweekly stable + production release cut (1st & 15th): beta -> stable -> release
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      channel:
        description: "Target release channel to fast-forward"
        type: choice
        options: [release, nightly, beta, stable]
        default: release
      source:
        description: "Source branch (default follows develop->nightly->beta->stable->release)"
        type: choice
        options: [default, develop, nightly, beta, stable]
        default: default
      dry_run:
        description: "Preview promotion without pushing"
        type: boolean
        default: false

concurrency:
  group: promote-release-channels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Fast-forward release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch integration and release branches
        run: git fetch --no-tags origin develop nightly beta stable release

      - name: Promote release channel (fast-forward only)
        env:
          # Must not be GITHUB_TOKEN for --apply: its pushes trigger no deployment workflows.
          GH_TOKEN: ${{ inputs.dry_run && (secrets.MERGE_GATE_TOKEN || github.token) || secrets.MERGE_GATE_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          TARGET_CHANNEL: ${{ inputs.channel }}
          SOURCE_BRANCH: ${{ inputs.source }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--repo "${{ github.repository }}")
          if [ "$EVENT_NAME" = "schedule" ]; then
            args+=(--schedule "$SCHEDULE_CRON")
          else
            args+=(--target-branch "$TARGET_CHANNEL")
            if [ -n "$SOURCE_BRANCH" ] && [ "$SOURCE_BRANCH" != "default" ]; then
              args+=(--source-branch "$SOURCE_BRANCH")
            fi
          fi

          if [ "$DRY_RUN" != "true" ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "::error::MERGE_GATE_TOKEN is not set; run scripts/secrets/rotate.py MERGE_GATE_TOKEN"
              exit 1
            fi
            args+=(--apply)
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              args+=(--strict-pending)
            fi
          fi

          python3 scripts/github/promote_release.py "${args[@]}"
