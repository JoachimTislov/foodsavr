name: Release (Gated)

on:
  workflow_run:
    workflows: ["Web Build"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  gate:
    name: Evaluate release gate
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    outputs:
      release_web: ${{ steps.evaluate.outputs.release_web }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Evaluate validation matrix for commit
        id: evaluate
        uses: actions/github-script@v8
        with:
          script: |
            await require('./scripts/release/release_gate.cjs').evaluate({github, context, core});

  release-web:
    name: Release Web candidate
    needs: gate
    if: needs.gate.outputs.release_web == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SECRETS: ${{ secrets.FIREBASE_CLI_TOKEN != '' && secrets.FIREBASE_APP_ID_ANDROID != '' }}
    steps:
      - name: Download web build artifact from triggering run
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          name: web-build
          path: artifacts/web
          if_no_artifact_found: fail

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web-candidate
          path: artifacts/web
