name: Android Build

# Manual only (`make build-remote`, or Actions -> Android Build -> Run workflow).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: "3.47.6"
          write-dummy-google-services: "true"

      - name: Build development debug APK
        run: flutter build apk --flavor development --debug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: build/app/outputs/flutter-apk/app-development-debug.apk

      - name: Record provenance
        if: ${{ !cancelled() }}
        uses: ./.github/actions/provenance
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          pr: ${{ github.event.pull_request.number }}
