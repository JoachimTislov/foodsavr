name: Web Build

on:
  push:
    branches: [daily, weekly, stable]
    paths:
      - "lib/**"
      - "packages/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-web.yml"
      - ".github/actions/setup-flutter-app/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: "3.47.6"

      - name: Generate web platform files
        run: flutter create . --platforms web

      - name: Build web
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

      - name: Record provenance
        if: ${{ !cancelled() }}
        uses: ./.github/actions/provenance
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          pr: ${{ github.event.pull_request.number }}
