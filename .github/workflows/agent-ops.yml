name: Agent Ops

# Autonomous agent operations (#496), each gated on its own event and operation:
#
# - implement (issues labeled triage/ready-for-agent, or dispatch): implements the
#   issue through the same agentctl workflow used locally and in T3 Code. The
#   provider edits an isolated worktree with no git, network, or GitHub permission.
#   Agent-written code runs only in the read-only `implement` job; the
#   `implement-publish` job, on a fresh runner, applies the verified patch, commits it
#   with an Agent-Session trailer, and opens a draft PR.
# - review (pull_request_target, trusted `@foodsavr-agent review` PR comments, or
#   dispatch): classifies and reviews non-draft,
#   same-repository PRs at their adaptive review tier (exempt, fast, balanced, deep,
#   human) and posts a head-bound attestation review (<!-- agent-review: ... -->)
#   consumed by the merge gate (ADR 0006). Automatic reviews are off when the
#   repository variable AGENT_AUTO_REVIEW_ENABLED is `false`; dispatch and trusted
#   PR-comment requests still review. Untrusted PR code is never checked out or
#   executed; the jobs check out the default branch and fetch PR metadata and diff
#   text via the GitHub API. `review` reads untrusted PR text and holds provider
#   credentials but only a read-only token; `review-publish` holds write permissions
#   but never runs a model or sees provider credentials, and only parses the review
#   job's artifact.
# - audit (nightly schedule, or dispatch): deterministic agent-system metrics plus a
#   quota-aware model summary, published as an issue and to the history branch.
# - incident (dispatch only, owner-triggered): bisects a regression on the default
#   branch (merge level, then the culprit's branch), maps the culprit to its PR and
#   original review tier, and records an escalating incident on the
#   agent-review-history branch so later PRs touching the same code get a deeper
#   review tier (ADR 0006). Runs only trusted default-branch code; the test command is
#   supplied by a repository writer via workflow_dispatch.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, ready_for_review, synchronize, reopened]
  schedule:
    - cron: '0 0 * * *'
      timezone: Europe/Oslo
  workflow_dispatch:
    inputs:
      operation:
        description: Agent operation to run
        type: choice
        required: true
        options: [implement, review, audit, incident]
      issue:
        description: "implement: issue number"
        required: false
      healing_mode:
        description: "implement: enforce bounded two-way-door healing path guardrails"
        type: boolean
        required: false
        default: false
      pr:
        description: "review: pull request number to classify and review"
        required: false
      force:
        description: "audit: run even below the data threshold"
        type: boolean
        default: false
      good:
        description: "incident: known good commit or ref"
        required: false
      bad:
        description: "incident: known bad commit or ref"
        required: false
        default: HEAD
      test_cmd:
        description: "incident: non-interactive command that exits 0 on good and non-zero on bad"
        required: false
      failure_signature:
        description: "incident: short description of the symptom"
        required: false
        default: ""

run-name: >-
  ${{ format('Agent Ops: {0}',
    (github.event_name == 'pull_request_target' || github.event_name == 'issue_comment' || inputs.operation == 'review') && format('review #{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr) ||
    (github.event_name == 'issues' || inputs.operation == 'implement') && format('implement #{0}', github.event.issue.number || inputs.issue) ||
    (github.event_name == 'schedule' || inputs.operation == 'audit') && 'audit' ||
    'incident') }}

# One group per operation and item, named as before the consolidation: a review of
# one PR cancels only that PR's older review, and issue, audit and incident runs
# never cancel each other. The group mirrors the `review` job's eligibility: an
# ineligible review event (a foreign comment, or a push while automatic review is
# disabled, on a draft, from a fork, or by Dependabot) gets a unique group so a run
# that will only skip can never cancel an active review (#531).
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' && inputs.operation == 'review') && format('agent-review-{0}', inputs.pr) ||
    (github.event_name == 'issue_comment') && ((github.event.issue.pull_request && contains(github.event.comment.body, '@foodsavr-agent review') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) && format('agent-review-{0}', github.event.issue.number) || format('agent-review-skip-{0}-{1}', github.event.issue.number, github.run_id)) ||
    (github.event_name == 'pull_request_target') && ((vars.AGENT_AUTO_REVIEW_ENABLED != 'false' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]') && format('agent-review-{0}', github.event.pull_request.number) || format('agent-review-skip-{0}-{1}', github.event.pull_request.number, github.run_id)) ||
    (github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'implement')) && format('agent-implement-{0}{1}', github.event.issue.number || inputs.issue, (github.event_name == 'issues' && github.event.label.name != 'triage/ready-for-agent') && format('-label-{0}', github.run_id) || '') ||
    (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'audit')) && 'agent-system-audit' ||
    'agent-incident' }}
  cancel-in-progress: >-
    ${{ (github.event_name == 'workflow_dispatch' && inputs.operation == 'review') ||
    (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@foodsavr-agent review') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
    (github.event_name == 'pull_request_target' && vars.AGENT_AUTO_REVIEW_ENABLED != 'false' && !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]') }}

permissions:
  contents: read

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}
  BRANCH: agent/issue-${{ github.event.issue.number || inputs.issue }}
  HEALING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.healing_mode == true }}
  PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}

jobs:
  # --- implement ----------------------------------------------------------------

  implement-capabilities:
    name: Check implementation credentials
    # Owner can trigger any issue; automated healing_mode dispatch from monitoring
    # workflows is restricted to bot actors on issues carrying a healing fingerprint.
    if: >-
      ((github.event_name == 'workflow_dispatch' && inputs.operation == 'implement') ||
       (github.event_name == 'issues' && github.event.label.name == 'triage/ready-for-agent')) &&
      (github.actor == github.repository_owner ||
       (github.event_name == 'workflow_dispatch' &&
        inputs.healing_mode == true &&
        endsWith(github.actor, '[bot]')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      - name: Check implementation credentials
        id: credentials
        env:
          HAS_PROVIDER: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.CODEX_AUTH_JSON_B64 != '' || secrets.ANTIGRAVITY_OAUTH_TOKEN_B64 != '' || secrets.GEMINI_API_KEY != '' }}
          HAS_APP: ${{ (vars.AGENT_APP_ID != '' || secrets.AGENT_APP_ID != '') && secrets.AGENT_APP_PRIVATE_KEY != '' }}
        run: |
          if [[ "$HAS_PROVIDER" != true || "$HAS_APP" != true ]]; then
            echo "Agent implementation skipped. Configure a model login and the agent GitHub App." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  implement:
    name: Implement issue
    needs: implement-capabilities
    if: needs.implement-capabilities.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      issues: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
      session: ${{ steps.patch.outputs.session }}
      status: ${{ steps.patch.outputs.status }}
      verify: ${{ steps.verify.outputs.result }}
    steps:
      - name: Validate input and skip existing agent branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "issue must be a number"; exit 1; }
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists; resolve or delete it first."; exit 1
          fi
          if [ "$HEALING_MODE" = "true" ]; then
            body="$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            if ! printf '%s' "$body" | grep -q '<!-- healing-fingerprint:'; then
              echo "healing_mode requires an issue with a healing-fingerprint marker."
              exit 1
            fi
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install configured provider CLIs
        id: providers
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          ANTIGRAVITY_OAUTH_TOKEN_B64: ${{ secrets.ANTIGRAVITY_OAUTH_TOKEN_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/agents/install-ci-providers.sh

      - name: Prepare issue context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .agents/state/workflows
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json number,title,body,labels,comments \
            > ".agents/state/issue-${ISSUE}.json"
          jq -r '"# Issue #\(.number): \(.title)\n\nLabels: \([.labels[].name] | join(", "))\n\n\(.body)"' \
            ".agents/state/issue-${ISSUE}.json" > ".agents/state/issue-${ISSUE}.md"
          # Comments get their own context budget; newest first so truncation drops the oldest.
          jq -r '
            [ .comments[]? | select(.authorAssociation == "OWNER" or .authorAssociation == "COLLABORATOR" or .authorAssociation == "MEMBER") ]
            | if length > 0 then
                "## Trusted Comments & Agent Briefs (newest first)\n\n" +
                (reverse | map("### Comment by @\(.author.login // "unknown") (\(.authorAssociation))\n\n\(.body)") | join("\n\n---\n\n"))
              else empty end
          ' ".agents/state/issue-${ISSUE}.json" > ".agents/state/issue-${ISSUE}-comments.md"
          files=()
          for file in ".agents/state/issue-${ISSUE}.md" ".agents/state/issue-${ISSUE}-comments.md"; do
            [ -s "$file" ] || continue
            files+=("$file")
            # Matches CONTEXT_FILE_LIMIT in scripts/agents/agentctl.py.
            if [ "$(wc -m < "$file")" -gt 12000 ]; then
              echo "::warning::${file} exceeds the 12000-character context limit and is truncated."
            fi
          done
          jq --arg issue "#${ISSUE}" \
            --slurpfile metadata ".agents/state/issue-${ISSUE}.json" '
            [$metadata[0].labels[].name] as $labels |
            .context.files += $ARGS.positional | .references.issues = [$issue] |
            .steps[] |= (
              if $labels | index("risk/security") then .work_type = "security" | .tier = "deep"
              elif $labels | index("type/documentation") then .work_type = "documentation"
              elif $labels | index("type/dependency") then .work_type = "refactoring"
              else . end
            )
          ' .agents/workflows/implement-issue.json --args "${files[@]}" > .agents/state/workflows/implement-issue.json

      - name: Run implement-issue workflow
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROUTER_BASE_URL: ${{ vars.ROUTER_BASE_URL || secrets.ROUTER_BASE_URL }}
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          ROUTER_MODEL: ${{ vars.ROUTER_MODEL || secrets.ROUTER_MODEL }}
          AGENT_POLICY_FILE: .agents/policies/agent-implement.json
          PROVIDERS: ${{ steps.providers.outputs.providers }}
        run: |
          jq --arg roster "$PROVIDERS" '
            ($roster | split(" ")) as $configured |
            .steps[].providers |= map(select(. as $name | $configured | index($name) != null))
          ' .agents/state/workflows/implement-issue.json > .agents/state/workflows/configured-implement.json
          scripts/agents/agentctl workflow run .agents/state/workflows/configured-implement.json \
            --execute > .agents/state/result.json || true
          jq '{status, run_id, session_ids, patch, steps: [.steps[] | {id, status, provider, reason}]}' .agents/state/result.json
          reason="$(jq -r '.reason // empty' .agents/state/result.json)"
          if [[ "$reason" == "Manual step required"* ]]; then
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove provider credentials
        if: always()
        run: rm -f "$HOME/.codex/auth.json" "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"

      - name: Apply patch
        id: patch
        run: |
          # The healing checker must come from the trusted checkout, captured before
          # the model patch is applied: a patch to the checker itself must not decide
          # whether the patch is safe (#531).
          cp scripts/monitoring/check_healing_patch.py "$RUNNER_TEMP/check_healing_patch.py"
          patch="$(jq -r '.patch // empty' .agents/state/result.json 2>/dev/null || true)"
          session="$(jq -r '.session_ids[0] // empty' .agents/state/result.json 2>/dev/null || true)"
          echo "session=${session}" >> "$GITHUB_OUTPUT"
          echo "status=$(jq -r '.status // "error"' .agents/state/result.json 2>/dev/null || echo error)" >> "$GITHUB_OUTPUT"
          if [ -n "$patch" ] && [ -s "$patch" ] && [ -n "$session" ]; then
            git apply --index "$patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.patch.outputs.changed == 'true'
        with:
          flutter-version: 3.47.6
          channel: "stable"
          cache: true

      - name: Verify patch
        if: steps.patch.outputs.changed == 'true'
        id: verify
        run: |
          echo 'CI_TEST=1' > assets/.env
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test
          set +e
          flutter analyze --fatal-infos --fatal-warnings --no-pub > .agents/state/analyze.log 2>&1; analyze=$?
          dart run scripts/locale/check_localizations.dart > .agents/state/locale.log 2>&1; locale=$?
          flutter test --no-pub > .agents/state/test.log 2>&1; tests=$?
          # Each group runs only when the staged patch touches its paths in local_ci.py.
          python3 scripts/ci/local_ci.py --staged --group agents > .agents/state/agents_ci.log 2>&1; agent_checks=$?
          python3 scripts/ci/local_ci.py --staged --group docs > .agents/state/docs_ci.log 2>&1; doc_checks=$?
          set -e
          state() { [ "$1" = 0 ] && echo passed || echo failed; }
          result=passed; [ "$analyze$locale$tests$agent_checks$doc_checks" = "00000" ] || result=failed
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          printf -- '- analyze: %s\n- localization: %s\n- tests: %s\n- agent_checks: %s\n- doc_checks: %s\n' \
            "$(state $analyze)" "$(state $locale)" "$(state $tests)" "$(state $agent_checks)" "$(state $doc_checks)" > .agents/state/verify.md

      - name: Export final patch
        if: steps.patch.outputs.changed == 'true'
        run: |
          git add --update
          if [ "$HEALING_MODE" = "true" ]; then
            python3 "$RUNNER_TEMP/check_healing_patch.py" --git-cached
          fi
          git diff --cached --binary > .agents/state/final.patch

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-implement-${{ env.ISSUE }}
          path: |
            .agents/state/result.json
            .agents/state/final.patch
            .agents/state/verify.md
            .agents/state/*.log
            .agents/state/runs/*/events.jsonl
          if-no-files-found: ignore
          retention-days: 14

  implement-publish:
    name: Publish implementation
    needs: implement
    if: always() && needs.implement.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Mint agent App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENT_APP_ID || secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: needs.implement.outputs.changed == 'true'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: needs.implement.outputs.changed == 'true' || needs.implement.outputs.status == 'unavailable'
        # Only a patch requires the artifact; without one, the report falls back to the run status.
        continue-on-error: ${{ needs.implement.outputs.changed != 'true' }}
        with:
          name: agent-implement-${{ env.ISSUE }}
          path: ${{ runner.temp }}/agent

      - name: Commit, push, and open PR
        if: needs.implement.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          SESSION: ${{ needs.implement.outputs.session }}
          VERIFY: ${{ needs.implement.outputs.verify }}
          AUTO_HEAL_MERGE: ${{ vars.AUTO_HEAL_MERGE }}
          ARTIFACTS: ${{ runner.temp }}/agent
        run: |
          title="$(gh issue view "$ISSUE" --json title --jq .title)"
          trusted_checker="$RUNNER_TEMP/check_healing_patch.py"
          cp scripts/monitoring/check_healing_patch.py "$trusted_checker"
          git apply --index "$ARTIFACTS/final.patch"
          if [ "$HEALING_MODE" = "true" ]; then
            python3 "$trusted_checker" --git-cached
          fi
          bot="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot}" --jq .id)"
          ci_note="Pushed by ${bot}, so CI runs on this PR."
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git switch -c "$BRANCH"
          git -c core.hooksPath=/dev/null commit --no-verify -m "feat: implement #${ISSUE}" -m "${title}" \
            -m "Closes #${ISSUE}" -m "Agent-Session: ${SESSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          ready_auto_heal=false
          door_note="Draft until reviewed."
          if [ "$HEALING_MODE" = "true" ] && [ "$AUTO_HEAL_MERGE" = "true" ] && [ "$VERIFY" = "passed" ] && [ -n "$APP_SLUG" ]; then
            ready_auto_heal=true
            door_note="Verified two-way-door healing fix labeled merge/auto."
          fi
          {
            echo "### What does this PR do?"
            echo
            echo "Implements #${ISSUE} (${title}) through the \`implement-issue\` agent workflow."
            echo
            echo "Closes: #${ISSUE}"
            echo
            echo "## Evidence"
            echo
            echo "Runner verification (${VERIFY:-not run}):"
            cat "$ARTIFACTS/verify.md" 2>/dev/null || true
            echo
            echo "## Merge Danger"
            echo
            echo "**Door:** two-way. ${door_note} ${ci_note}"
            echo
            echo "### AI Contribution & Experience Disclosure"
            echo
            echo "*   **Author-By:** agent-implement workflow, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "*   **Model-Used:** provider session \`${SESSION}\`"
            echo "*   **Summary of AI-generated content:** the full diff"
          } > "$RUNNER_TEMP/pr-body.md"
          if [ "$ready_auto_heal" = "true" ]; then
            pr_url="$(gh pr create --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
              --title "feat: implement #${ISSUE}" --body-file "$RUNNER_TEMP/pr-body.md")"
            gh pr edit "$pr_url" --add-label "merge/auto"
          else
            gh pr create --draft --base "${GITHUB_REF_NAME}" --head "$BRANCH" \
              --title "feat: implement #${ISSUE}" --body-file "$RUNNER_TEMP/pr-body.md"
          fi

      - name: Report to the issue
        if: always()
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHANGED: ${{ needs.implement.outputs.changed }}
          STATUS: ${{ needs.implement.outputs.status }}
          VERIFY: ${{ needs.implement.outputs.verify }}
          SESSION: ${{ needs.implement.outputs.session }}
          ARTIFACTS: ${{ runner.temp }}/agent
        run: |
          reason=""
          resets_at=""
          if [ "$STATUS" = "unavailable" ] && [ -f "$ARTIFACTS/result.json" ]; then
            reason="$(jq -r '.reason // empty' "$ARTIFACTS/result.json" 2>/dev/null || true)"
            resets_at="$(jq -r '.resets_at // empty' "$ARTIFACTS/result.json" 2>/dev/null || true)"
            [[ "$resets_at" =~ ^[0-9TZ:.+-]+$ ]] || resets_at=""
          fi
          pause=""
          if [ "$reason" = "quota-exhausted" ]; then
            pause="paused on a provider usage limit, which is not an implementation failure"
            if [ -n "$resets_at" ]; then pause="${pause} (earliest reset: ${resets_at})"; fi
          fi
          if [ "$CHANGED" = "true" ]; then
            outcome="produced a patch on \`${BRANCH}\` (runner verification: ${VERIFY:-not run}); see the draft PR"
            if [ -n "$pause" ]; then
              outcome="${pause}. The patch on \`${BRANCH}\` may be partial (runner verification: ${VERIFY:-not run}); review its pull request before relying on it"
            fi
          elif [ -n "$pause" ]; then
            outcome="${pause}. No pull request was opened; run it again after the limit resets"
          elif [ "$STATUS" = "unavailable" ]; then
            outcome="was unavailable and made no change; see the run log"
          else
            outcome="made no change (workflow status: ${STATUS:-not run})"
          fi
          printf '> *This was generated by AI during an agent run.*\n\nAgent run %s %s. Session: `%s`.\n' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$outcome" "${SESSION:-none}" \
            > "$RUNNER_TEMP/comment.md"
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

  # --- review -------------------------------------------------------------------

  review:
    name: Adaptive PR review
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'review') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@foodsavr-agent review') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_target' &&
       vars.AGENT_AUTO_REVIEW_ENABLED != 'false' &&
       !github.event.pull_request.draft &&
       !github.event.pull_request.head.repo.fork &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.classify.outputs.skip }}
      required_tier: ${{ steps.classify.outputs.required_tier }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      carryover: ${{ steps.classify.outputs.carryover }}
      executed_tier: ${{ steps.plan.outputs.tier }}
      run_model: ${{ steps.plan.outputs.run_model }}
      skip_reason: ${{ steps.plan.outputs.skip_reason }}
      skip_code: ${{ steps.plan.outputs.skip_code }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Load review history from the history branch
        env:
          HISTORY_TOKEN: ${{ github.token }}
        run: scripts/github/review_history.sh fetch "$HISTORY_TOKEN"

      - name: Fetch PR metadata and classify adaptive review tier
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "PR_NUMBER must be an integer"; exit 1; }
          mkdir -p .agents/state/workflows
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,isDraft,isCrossRepository,headRefOid,author,labels,files,additions,deletions,changedFiles,reviewDecision,reviews,comments \
            > ".agents/state/pr-${PR_NUMBER}-meta.json"
          # Fetch REST PR object for author_association and immutable base/head commit SHAs.
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > ".agents/state/pr-${PR_NUMBER}-rest.json"
          assoc="$(jq -r '.author_association // "NONE"' ".agents/state/pr-${PR_NUMBER}-rest.json")"
          base_sha="$(jq -r '.base.sha // ""' ".agents/state/pr-${PR_NUMBER}-rest.json")"
          rest_head_sha="$(jq -r '.head.sha // ""' ".agents/state/pr-${PR_NUMBER}-rest.json")"
          jq --arg assoc "$assoc" --arg base_sha "$base_sha" '. + {authorAssociation: $assoc, baseRefOid: $base_sha}' \
            ".agents/state/pr-${PR_NUMBER}-meta.json" > ".agents/state/pr-${PR_NUMBER}-raw.json"
          is_draft="$(jq -r '.isDraft // false' ".agents/state/pr-${PR_NUMBER}-raw.json")"
          is_fork="$(jq -r '.isCrossRepository // false' ".agents/state/pr-${PR_NUMBER}-raw.json")"
          if [ "$is_draft" = "true" ] || [ "$is_fork" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "carryover=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_sha="$(jq -r '.headRefOid // ""' ".agents/state/pr-${PR_NUMBER}-raw.json")"
          # Fetch immutable commit-to-commit diff so a concurrent push cannot swap the reviewed patch.
          if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] && [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] && [ "$head_sha" = "$rest_head_sha" ]; then
            gh api -H "Accept: application/vnd.github.v3.diff" \
              "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${head_sha}" \
              > ".agents/state/pr-${PR_NUMBER}.diff" || rm -f ".agents/state/pr-${PR_NUMBER}.diff"
          fi
          if [ ! -f ".agents/state/pr-${PR_NUMBER}.diff" ]; then
            echo "::error::Could not fetch the immutable PR diff; refusing to run or attest a review."
            exit 1
          fi
          python3 scripts/github/pr_review.py classify \
            --pr "$PR_NUMBER" \
            --pr-json ".agents/state/pr-${PR_NUMBER}-raw.json" \
            --diff-file ".agents/state/pr-${PR_NUMBER}.diff" \
            --owner "${GITHUB_REPOSITORY_OWNER}" \
            --stage-dir .agents/state \
            --stage-workflow ".agents/state/workflows/integrate-pr-${PR_NUMBER}.json" \
            > ".agents/state/pr-${PR_NUMBER}-classification.json"
          req_tier="$(jq -r '.required_tier' ".agents/state/pr-${PR_NUMBER}-classification.json")"
          head_sha="$(jq -r '.head_sha' ".agents/state/pr-${PR_NUMBER}-classification.json")"
          carryover="false"
          if [ "$EVENT_NAME" = "pull_request_target" ] && [ "$EVENT_ACTION" = "synchronize" ] \
             && [ "$req_tier" != "exempt" ] && [ "$req_tier" != "human" ]; then
            python3 scripts/github/pr_review.py check-carryover \
              --pr "$PR_NUMBER" \
              --head-sha "$head_sha" \
              --required-tier "$req_tier" \
              --pr-json ".agents/state/pr-${PR_NUMBER}-raw.json" \
              --diff-file ".agents/state/pr-${PR_NUMBER}.diff" \
              --owner "${GITHUB_REPOSITORY_OWNER}" \
              > ".agents/state/pr-${PR_NUMBER}-carryover.json"
            if [ "$(jq -r '.eligible // false' ".agents/state/pr-${PR_NUMBER}-carryover.json")" = "true" ]; then
              carryover="true"
              echo "Patch-equivalent rebase detected; skipping redundant model review." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "required_tier=${req_tier}" >> "$GITHUB_OUTPUT"
          echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "carryover=${carryover}" >> "$GITHUB_OUTPUT"

      - name: Check model credentials
        id: credentials
        if: steps.classify.outputs.skip == 'false' && steps.classify.outputs.required_tier != 'exempt' && steps.classify.outputs.carryover != 'true'
        env:
          HAS_PROVIDER: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.CODEX_AUTH_JSON_B64 != '' || secrets.ANTIGRAVITY_OAUTH_TOKEN_B64 != '' || secrets.GEMINI_API_KEY != '' }}
        run: echo "configured=$HAS_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.credentials.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Install configured provider CLIs
        id: providers
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
          ANTIGRAVITY_OAUTH_TOKEN_B64: ${{ secrets.ANTIGRAVITY_OAUTH_TOKEN_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash scripts/agents/install-ci-providers.sh

      # The only step that runs a model. The job token is read-only and GH_TOKEN is unset.
      - name: Select and execute the highest available review tier
        id: plan
        if: steps.credentials.outputs.configured != ''
        env:
          REQ_TIER: ${{ steps.classify.outputs.required_tier }}
          PROVIDERS: ${{ steps.providers.outputs.providers }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          provider_args=()
          read -r -a providers <<< "$PROVIDERS"
          for provider in "${providers[@]}"; do provider_args+=(--provider "$provider"); done
          plan="$(python3 scripts/github/pr_review.py prepare-review --required-tier "$REQ_TIER" \
            --workflow ".agents/state/workflows/integrate-pr-${PR_NUMBER}.json" \
            --result ".agents/state/pr-${PR_NUMBER}-result.json" "${provider_args[@]}")"
          tier="$(jq -r '.tier' <<< "$plan")"
          run_model="$(jq -r '.run_model' <<< "$plan")"
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "run_model=$run_model" >> "$GITHUB_OUTPUT"
          if [[ "$run_model" == false ]]; then
            skip_reason="$(jq -r '.skip_reason' <<< "$plan")"
            echo "skip_reason=$skip_reason" >> "$GITHUB_OUTPUT"
            echo "$skip_reason" >> "$GITHUB_STEP_SUMMARY"
            # Set only for a quota pause; a hard failure has no code.
            skip_code="$(jq -r '.reason // empty' <<< "$plan")"
            if [[ "$skip_code" == quota-exhausted ]]; then
              echo "skip_code=$skip_code" >> "$GITHUB_OUTPUT"
              echo "::notice title=Model review unavailable::$skip_reason"
            fi
          elif [[ "$tier" != "$REQ_TIER" && "$REQ_TIER" != human ]]; then
            echo "Review tier capped from $REQ_TIER to $tier for the available providers." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove provider credentials
        if: always()
        run: rm -f "$HOME/.codex/auth.json" "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"

      - name: Upload review state
        if: always() && steps.classify.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-review-state-${{ env.PR_NUMBER }}
          path: |
            .agents/state/pr-${{ env.PR_NUMBER }}*.json
            .agents/state/pr-${{ env.PR_NUMBER }}*.md
            .agents/state/workflows/integrate-pr-${{ env.PR_NUMBER }}.json
            .agents/state/runs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  review-publish:
    name: Record review and attest
    needs: review
    if: needs.review.result == 'success' && needs.review.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes only the agent-review-history branch
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download review state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-review-state-${{ env.PR_NUMBER }}
          # upload-artifact strips the common ancestor (.agents/state), so restore it here.
          path: .agents/state

      - name: Check agent App credentials
        id: app-config
        env:
          HAS_APP: ${{ (vars.AGENT_APP_ID != '' || secrets.AGENT_APP_ID != '') && secrets.AGENT_APP_PRIVATE_KEY != '' }}
        run: echo "configured=$HAS_APP" >> "$GITHUB_OUTPUT"

      # Reviews are published as the agent GitHub App when it is configured.
      - name: Mint agent App token
        id: app
        if: steps.app-config.outputs.configured == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENT_APP_ID || secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      # History is re-fetched here, never taken from the model job's artifact.
      - name: Load review history from the history branch
        env:
          HISTORY_TOKEN: ${{ github.token }}
        run: scripts/github/review_history.sh fetch "$HISTORY_TOKEN"

      - name: Record review decision and post head-bound attestation
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          AGENT_APP_SLUG: ${{ vars.AGENT_APP_SLUG }}
          BASE_SHA: ${{ needs.review.outputs.base_sha }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REQ_TIER: ${{ needs.review.outputs.required_tier }}
          CARRYOVER: ${{ needs.review.outputs.carryover }}
          EXECUTED_TIER: ${{ needs.review.outputs.executed_tier }}
          RUN_MODEL: ${{ needs.review.outputs.run_model }}
          SKIP_REASON: ${{ needs.review.outputs.skip_reason }}
          SKIP_CODE: ${{ needs.review.outputs.skip_code }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "PR_NUMBER must be an integer"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "invalid head sha"; exit 1; }
          # Always recompute PR metadata and immutable commit-to-commit diffs directly in publish
          # so patch_id and carryover verification never trust the model job's artifact or a mutable PR ref.
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,isDraft,isCrossRepository,headRefOid,author,labels,files,additions,deletions,changedFiles,reviewDecision,reviews,comments \
            > ".agents/state/pr-${PR_NUMBER}-publish-meta.json"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > ".agents/state/pr-${PR_NUMBER}-publish-rest.json"
          assoc="$(jq -r '.author_association // "NONE"' ".agents/state/pr-${PR_NUMBER}-publish-rest.json")"
          live_base="$(jq -r '.base.sha // ""' ".agents/state/pr-${PR_NUMBER}-publish-rest.json")"
          rest_head="$(jq -r '.head.sha // ""' ".agents/state/pr-${PR_NUMBER}-publish-rest.json")"
          jq --arg assoc "$assoc" --arg base_sha "$live_base" '. + {authorAssociation: $assoc, baseRefOid: $base_sha}' \
            ".agents/state/pr-${PR_NUMBER}-publish-meta.json" > ".agents/state/pr-${PR_NUMBER}-publish-raw.json"
          live_head="$(jq -r '.headRefOid // ""' ".agents/state/pr-${PR_NUMBER}-publish-raw.json")"
          # For model reviews, bind patch_id strictly to the exact immutable BASE_SHA...HEAD_SHA snapshot reviewed.
          diff_args=()
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
             && gh api -H "Accept: application/vnd.github.v3.diff" \
                "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
                > ".agents/state/pr-${PR_NUMBER}-publish.diff"; then
            diff_args=(--diff-file ".agents/state/pr-${PR_NUMBER}-publish.diff")
          fi
          # Publish as the agent App, except on a PR the App authored: the gate ignores
          # self-attestation, so those keep the github-actions identity.
          reviewer_login="github-actions"
          pr_author="$(jq -r '.user.login // ""' ".agents/state/pr-${PR_NUMBER}-publish-rest.json")"
          if [ -n "$APP_TOKEN" ] && [ -n "$APP_SLUG" ] && [ "$pr_author" != "${APP_SLUG}[bot]" ]; then
            export GH_TOKEN="$APP_TOKEN"
            reviewer_login="$APP_SLUG"
          fi
          reviewer="${reviewer_login}[bot]"
          review_file=".agents/state/pr-${PR_NUMBER}-review.json"
          post_review() {
            endpoint="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
            if jq -e '.comments | length > 0' "$review_file" >/dev/null; then
              # A retry on the same head reuses identical open conversations. A blocker whose
              # earlier thread was resolved gets a new thread, so it stays visible.
              gh api graphql -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" \
                -F number="$PR_NUMBER" -f query='
                  query($owner: String!, $name: String!, $number: Int!) {
                    repository(owner: $owner, name: $name) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100) {
                          nodes {
                            isResolved
                            comments(first: 1) {
                              nodes { path originalLine body author { login } originalCommit { oid } }
                            }
                          }
                        }
                      }
                    }
                  }' > "$RUNNER_TEMP/threads.json"
              jq --slurpfile threads "$RUNNER_TEMP/threads.json" --arg head "$HEAD_SHA" --arg login "$reviewer_login" '
                [$threads[0].data.repository.pullRequest.reviewThreads.nodes[] |
                  select(.isResolved | not) | .comments.nodes[0] |
                  select(.author.login == $login and .originalCommit.oid == $head) |
                  {path, line: .originalLine, side: "RIGHT", body}] as $existing |
                .comments -= $existing' "$review_file" > "$RUNNER_TEMP/review.json"
              review_file="$RUNNER_TEMP/review.json"
            fi
            gh api --method POST "$endpoint/reviews" --input "$review_file" --silent
          }
          common=(
            --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --required-tier "$REQ_TIER"
            --reviewer "$reviewer" --bot --owner "${GITHUB_REPOSITORY_OWNER}"
            --pr-json ".agents/state/pr-${PR_NUMBER}-publish-raw.json"
            "${diff_args[@]}"
          )
          if [ "$REQ_TIER" = "exempt" ]; then
            # Exempt PRs need no attestation, but their outcome still feeds tier learning.
            python3 scripts/github/pr_review.py record-review "${common[@]}" \
              --status approved --provider policy-exempt --model none
            exit 0
          fi
          if [ "$CARRYOVER" = "true" ]; then
            # Verify live head still matches HEAD_SHA and diff the exact immutable live_base...HEAD_SHA commits.
            if [ "$live_head" = "$HEAD_SHA" ] && [ "$rest_head" = "$HEAD_SHA" ] \
               && [[ "$live_base" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
               && gh api -H "Accept: application/vnd.github.v3.diff" \
                  "repos/${GITHUB_REPOSITORY}/compare/${live_base}...${HEAD_SHA}" \
                  > ".agents/state/pr-${PR_NUMBER}-publish-carryover.diff"; then
              python3 scripts/github/pr_review.py check-carryover \
                --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" --required-tier "$REQ_TIER" \
                --pr-json ".agents/state/pr-${PR_NUMBER}-publish-raw.json" \
                --diff-file ".agents/state/pr-${PR_NUMBER}-publish-carryover.diff" \
                --owner "${GITHUB_REPOSITORY_OWNER}" \
                > ".agents/state/pr-${PR_NUMBER}-publish-carryover.json"
            else
              echo '{"eligible":false,"reason":"head-moved"}' > ".agents/state/pr-${PR_NUMBER}-publish-carryover.json"
            fi
            if [ "$(jq -r '.eligible // false' ".agents/state/pr-${PR_NUMBER}-publish-carryover.json")" = "true" ]; then
              carried_tier="$(jq -r '.tier' ".agents/state/pr-${PR_NUMBER}-publish-carryover.json")"
              carried_from="$(jq -r '.carried_from_sha' ".agents/state/pr-${PR_NUMBER}-publish-carryover.json")"
              carried_patch="$(jq -r '.patch_id' ".agents/state/pr-${PR_NUMBER}-publish-carryover.json")"
              carried_provider="$(jq -r '.provider // "deterministic-carryover"' ".agents/state/pr-${PR_NUMBER}-publish-carryover.json")"
              carried_model="$(jq -r '.model // "none"' ".agents/state/pr-${PR_NUMBER}-publish-carryover.json")"
              carried_session="$(jq -r '.session_id // empty' ".agents/state/pr-${PR_NUMBER}-publish-carryover.json")"
              extra=()
              if [ -n "$carried_session" ]; then extra+=(--session-id "$carried_session"); fi
              python3 scripts/github/pr_review.py record-review "${common[@]}" \
                --status approved --tier "$carried_tier" \
                --reason patch-equivalent-rebase \
                --carried-from-sha "$carried_from" --patch-id "$carried_patch" \
                --provider "$carried_provider" --model "$carried_model" \
                --summary "Carried over approved ${carried_tier} review from ${carried_from:0:7} (identical patch after rebase)." \
                --output-review "$review_file" \
                "${extra[@]}"
              post_review
              exit 0
            fi
            echo "Carryover verification failed in publish; failing closed." >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/github/pr_review.py record-review "${common[@]}" \
              --status skipped --tier fast --provider deterministic-gate --model policy-verifier \
              --summary "Patch-equivalent carryover could not be verified on ${HEAD_SHA:0:7}; full review required." \
              --output-review "$review_file"
            post_review
            exit 0
          fi
          outcome=()
          if [[ "$RUN_MODEL" == true ]]; then
            outcome=(--workflow-result ".agents/state/pr-${PR_NUMBER}-result.json")
          else
            outcome=(--status skipped --provider deterministic-gate --model policy-verifier
              --summary "$SKIP_REASON")
            if [[ "$SKIP_CODE" == quota-exhausted ]]; then outcome+=(--reason "$SKIP_CODE"); fi
          fi
          python3 scripts/github/pr_review.py record-review "${common[@]}" \
            --tier "$EXECUTED_TIER" --capacity-cap \
            --output-review "$review_file" \
            "${outcome[@]}"
          post_review

      - name: Persist review history to the history branch
        # The decision is appended before the review is posted; keep it even when posting fails.
        if: ${{ !cancelled() }}
        env:
          HISTORY_TOKEN: ${{ github.token }}
        run: scripts/github/review_history.sh push "$HISTORY_TOKEN"

  # Wakes the merge gate once the attestation is posted, so an opted-in PR whose review
  # finishes after its checks is reconciled now instead of on the next schedule. A
  # separate job keeps actions: write away from the job that parses model output.
  review-wake-gate:
    name: Wake the merge gate
    needs: review-publish
    if: needs.review-publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Decide from the PR's labels as they are now, not as the review event
          # captured them: a maintainer may add merge/auto during the review. When
          # the label read fails, wake the gate anyway; it re-checks merge/auto
          # itself, and the 30-minute schedule stays the recovery path.
          if [ "${{ github.event_name }}" != workflow_dispatch ]; then
            if labels="$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels --jq '.labels[].name' 2>/dev/null)"; then
              if ! grep -Fxq merge/auto <<<"$labels"; then
                echo "merge/auto is not set at wake time; the scheduled gate run remains the recovery path."
                exit 0
              fi
            else
              echo "::warning::Could not read the PR's current labels; the gate re-checks merge/auto itself."
            fi
          fi
          gh workflow run merge-gate.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}" ||
            echo "::warning::Could not dispatch the merge gate; the schedule will run it."

  # --- audit --------------------------------------------------------------------

  audit-collect:
    name: Collect audit metrics
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'audit')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # run, job and job-log reads
      issues: read # PR timelines
      pull-requests: read
    outputs:
      trusted_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout trusted control plane
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Load audit and review history
        run: |
          python3 scripts/agents/agent_audit.py load
          scripts/github/review_history.sh fetch
          git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader"
      - name: Collect deterministic metrics
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_MIN_SESSIONS: ${{ vars.AUDIT_MIN_SESSIONS }}
          AUDIT_MIN_MERGED_PRS: ${{ vars.AUDIT_MIN_MERGED_PRS }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          python3 scripts/agents/agent_audit.py collect .agents/state/agent-audit.json "${args[@]}"
          jq -r '"run_model=\(.status == "completed" and (.already_published | not))"' \
            .agents/state/agent-audit.json >> "$GITHUB_OUTPUT"
      # A failed model step must still leave the deterministic snapshot for publish.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.collect.outputs.run_model == 'true'
        continue-on-error: true
        with:
          node-version: 22
      - name: Install the configured audit providers
        if: steps.collect.outputs.run_model == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_JSON_B64: ${{ secrets.CODEX_AUTH_JSON_B64 }}
        run: bash scripts/agents/install-ci-providers.sh
      - name: Run quota-aware audit model
        if: steps.collect.outputs.run_model == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/agents/agent_audit.py model
      - name: Remove provider credentials
        if: ${{ !cancelled() }}
        run: rm -f "$HOME/.codex/auth.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: agent-audit
          path: .agents/state/agent-audit.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  audit-publish:
    name: Publish audit
    needs: audit-collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      contents: write # pushes only the agent-audit-history branch
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.audit-collect.outputs.trusted_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-audit
          path: .agents/state
      - name: Publish the report and recurring findings
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/agents/agent_audit.py publish
      - name: Persist the audit to the history branch
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        run: python3 scripts/agents/agent_audit.py persist

  # --- incident -----------------------------------------------------------------

  incident:
    name: Bisect and record incident
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'incident'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # pushes only the agent-review-history branch
    steps:
      - name: Check incident inputs
        env:
          GOOD: ${{ inputs.good }}
          TEST_CMD: ${{ inputs.test_cmd }}
        run: |
          [ -n "$GOOD" ] || { echo "::error::operation=incident requires the good input"; exit 1; }
          [ -n "$TEST_CMD" ] || { echo "::error::operation=incident requires the test_cmd input"; exit 1; }

      - name: Checkout default branch with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load review history from the history branch
        env:
          HISTORY_TOKEN: ${{ github.token }}
        run: scripts/github/review_history.sh fetch "$HISTORY_TOKEN"

      - name: Bisect and learn
        env:
          GOOD: ${{ inputs.good }}
          BAD: ${{ inputs.bad }}
          TEST_CMD: ${{ inputs.test_cmd }}
          SIGNATURE: ${{ inputs.failure_signature }}
        run: |
          python3 scripts/github/pr_review.py bisect-learn \
            --good "$GOOD" --bad "$BAD" --test-cmd "$TEST_CMD" \
            --failure-signature "$SIGNATURE" | tee incident-report.json

      - name: Persist incident to the history branch
        env:
          HISTORY_TOKEN: ${{ github.token }}
        run: scripts/github/review_history.sh push "$HISTORY_TOKEN"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: incident-report
          path: incident-report.json
