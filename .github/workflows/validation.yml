name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      integration: ${{ steps.filter.outputs.integration }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            web:
              - 'lib/**'
              - 'web/**'
              - 'pubspec.yaml'
            android:
              - 'lib/**'
              - 'android/**'
              - 'pubspec.yaml'
            integration:
              - 'integration_test/**'
              - 'test_driver/**'
              - 'lib/**'
              - 'pubspec.yaml'
            e2e:
              - 'test/e2e/**'
              - 'lib/**'
              - 'web/**'
              - 'pubspec.yaml'

  web-smoke:
    name: Web smoke test
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: flutter pub get
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart
      - name: Create empty .env file
        run: touch assets/.env
      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate web platform files
        run: flutter create . --platforms web
      - name: Build web
        run: flutter build web --release
      - name: Start Firebase Emulators
        run: |
          npx -y firebase-tools@latest emulators:start --project demo-project &
          for i in $(seq 1 60); do
            curl -s http://localhost:4000 > /dev/null && break
            sleep 2
          done
      - name: Serve web build
        run: |
          npx -y serve build/web -l 8080 --no-clipboard &
          for i in $(seq 1 30); do
            curl -s http://localhost:8080 > /dev/null && break
            sleep 1
          done
      - name: Run Playwright smoke tests
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=smoke
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-artifacts
          path: test/e2e/playwright-report/
          retention-days: 7

  android-integration:
    name: Android integration tests
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' || needs.changes.outputs.integration == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart
      - name: Create empty .env file
        run: touch assets/.env
      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Start Firebase Emulators
        run: |
          npx -y firebase-tools@latest emulators:start --project demo-project &
          for i in $(seq 1 60); do
            curl -s http://localhost:4000 > /dev/null && break
            sleep 2
          done
      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64
          target: google_apis
          script: |
            adb reverse tcp:8080 tcp:8080
            adb reverse tcp:9099 tcp:9099
            flutter test integration_test --no-pub

  e2e-web:
    name: Web E2E (Playwright)
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: flutter pub get
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart
      - name: Create empty .env file
        run: touch assets/.env
      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate web platform files
        run: flutter create . --platforms web
      - name: Build web
        run: flutter build web --release
      - name: Start Firebase Emulators
        run: |
          npx -y firebase-tools@latest emulators:start --project demo-project &
          for i in $(seq 1 60); do
            curl -s http://localhost:4000 > /dev/null && break
            sleep 2
          done
      - name: Serve web build
        run: |
          npx -y serve build/web -l 8080 --no-clipboard &
          for i in $(seq 1 30); do
            curl -s http://localhost:8080 > /dev/null && break
            sleep 1
          done
      - name: Run Playwright E2E tests
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test/e2e/playwright-report/
          retention-days: 7
