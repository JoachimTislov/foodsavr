name: Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
      integration: ${{ steps.filter.outputs.integration }}
      e2e: ${{ steps.filter.outputs.e2e }}
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Path filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            web:
              - 'lib/**'
              - 'web/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'test/e2e/**'
            android:
              - 'lib/**'
              - 'android/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            integration:
              - 'integration_test/**'
              - 'test_driver/**'
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            e2e:
              - 'test/e2e/**'
              - 'lib/**'
              - 'web/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            rules:
              - 'firestore-rules/**'
              - '.github/workflows/validation.yml'

  web-smoke:
    name: Web smoke test
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: flutter pub get
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart
      - name: Write minimal .env
        run: echo 'CI_TEST=1' > assets/.env
      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate web platform files
        run: flutter create . --platforms web
      - name: Build web
        run: flutter build web --release
      - name: Start Firebase Emulators
        run: |
          cat > firebase.json <<'EOT'
          {
            "firestore": {
              "rules": "firestore.rules"
            },
            "emulators": {
              "auth": { "port": 9099 },
              "firestore": { "port": 8080 },
              "ui": { "enabled": true, "port": 4000 }
            }
          }
          EOT
          cat > firestore.rules <<'EOT'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /{document=**} {
                allow read, write: if true;
              }
            }
          }
          EOT
          npx -y firebase-tools@latest emulators:start --project demo-project &
          for i in $(seq 1 60); do
            curl -s http://localhost:4000 > /dev/null && break
            sleep 2
          done
      - name: Serve web build
        run: |
          npx -y serve build/web -l 4173 --no-clipboard &
          for i in $(seq 1 30); do
            curl -s http://localhost:4173 > /dev/null && break
            sleep 1
          done
      - name: Run Playwright smoke tests
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --project=smoke
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-artifacts
          path: test/e2e/playwright-report/
          retention-days: 7

  android-smoke:
    name: Android smoke test
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart
      - name: Write minimal .env
        run: echo 'CI_TEST=1' > assets/.env
      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Write dummy google-services.json (development)
        run: |
          mkdir -p android/app/src/development/debug
          cat > android/app/src/development/debug/google-services.json <<'EOT'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "demo-project",
              "storage_bucket": "demo-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:dummyid123456",
                  "android_client_info": {
                    "package_name": "com.foodsavr.app.development"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDummyKeyForDemoOnly" }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOT
      - name: Build development debug APK
        run: flutter build apk --flavor development --debug
      - name: Install, launch and verify APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            set -e
            adb install -r build/app/outputs/flutter-apk/app-development-debug.apk
            adb shell am start -W -n com.foodsavr.app.development/.MainActivity
            adb wait-for-device
            for i in $(seq 1 30); do adb shell pidof com.foodsavr.app.development > /dev/null && break; sleep 1; done
            adb shell pidof com.foodsavr.app.development
            for i in $(seq 1 10); do adb shell "dumpsys activity activities | grep -q 'mResumedActivity.*com.foodsavr.app.development/.MainActivity'" && break; sleep 1; done; adb shell "dumpsys activity activities | grep -q 'mResumedActivity.*com.foodsavr.app.development/.MainActivity'"
            for i in $(seq 1 10); do adb shell "dumpsys window windows | grep -q 'mCurrentFocus.*com.foodsavr.app.development'" && break; sleep 1; done; adb shell "dumpsys window windows | grep -q 'mCurrentFocus.*com.foodsavr.app.development'"
            for i in $(seq 1 15); do adb shell "dumpsys gfxinfo com.foodsavr.app.development | grep -q 'Total frames rendered: [1-9]' && break; sleep 2; done; adb shell "dumpsys gfxinfo com.foodsavr.app.development | grep -q 'Total frames rendered: [1-9]'"
            sleep 5
            adb logcat -d -s AndroidRuntime:E | (! grep -q 'FATAL EXCEPTION')
            adb logcat -d | grep -v 'FlutterJNI\|chromium\|eglCodecCommon' | (! grep -qi 'unhandled exception\|FATAL EXCEPTION')

  firestore-rules:
    name: Firestore security rules
    needs: changes
    if: ${{ needs.changes.outputs.rules == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: firestore-rules
        run: npm ci
      - name: Check rules secret availability
        id: rules_secret
        env:
          FIRESTORE_RULES_B64: ${{ secrets.FIRESTORE_RULES_B64 }}
        run: |
          if [ -n "$FIRESTORE_RULES_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIRESTORE_RULES_B64 is not set — skipping rules validation. Set it to activate this gate."
          fi
      - name: Write firestore.rules from secret
        if: steps.rules_secret.outputs.available == 'true'
        env:
          FIRESTORE_RULES_B64: ${{ secrets.FIRESTORE_RULES_B64 }}
        run: |
          echo "$FIRESTORE_RULES_B64" | base64 -d > firestore.rules
          if [ ! -s firestore.rules ]; then
            echo "Decoded firestore.rules is empty — check the secret encoding" >&2
            exit 1
          fi
          # Fail fast if the decoded file is not rules source.
          grep -q "rules_version" firestore.rules || {
            echo "firestore.rules does not look like Firestore rules (missing rules_version)" >&2
            exit 1
          }
      - name: Start Firestore emulator
        if: steps.rules_secret.outputs.available == 'true'
        run: |
          cat > firebase.json <<'EOT'
          {
            "firestore": {
              "rules": "firestore.rules"
            },
            "emulators": {
              "firestore": { "port": 8080 }
            }
          }
          EOT
          npx -y firebase-tools@15 emulators:start --project demo-project &
          emulator_up=false
          for _ in $(seq 1 60); do
            if curl -s http://localhost:8080 > /dev/null; then emulator_up=true; break; fi
            sleep 2
          done
          if [ "$emulator_up" != true ]; then
            echo "Firestore emulator did not start" >&2
            exit 1
          fi
      - name: Run rules unit tests
        if: steps.rules_secret.outputs.available == 'true'
        working-directory: firestore-rules
        run: npx jest --ci

  android-integration:
    name: Android integration tests
    needs: [changes, android-smoke]
    if: ${{ !cancelled() && needs.android-smoke.result == 'success' && (needs.changes.outputs.android == 'true' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart
      - name: Write minimal .env
        run: echo 'CI_TEST=1' > assets/.env
      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Start Firebase Emulators
        run: |
          cat > firebase.json <<'EOT'
          {
            "firestore": {
              "rules": "firestore.rules"
            },
            "emulators": {
              "auth": { "port": 9099 },
              "firestore": { "port": 8080 },
              "ui": { "enabled": true, "port": 4000 }
            }
          }
          EOT
          cat > firestore.rules <<'EOT'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /{document=**} {
                allow read, write: if true;
              }
            }
          }
          EOT
          npx -y firebase-tools@latest emulators:start --project demo-project &
          for i in $(seq 1 60); do
            curl -s http://localhost:4000 > /dev/null && break
            sleep 2
          done
      - name: Write dummy google-services.json
        run: |
          mkdir -p android/app/src/development/debug android/app/src/production/debug
          cat > android/app/src/development/debug/google-services.json <<'EOT'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "demo-project",
              "storage_bucket": "demo-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:dummyid123456",
                  "android_client_info": {
                    "package_name": "com.foodsavr.app.development"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDummyKeyForDemoOnly" }
                ],
                "services": {
                  "appinvite_service": {
                    "google_api_initializer": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOT
      - name: Write production google-services.json
        run: |
          sed 's/com.foodsavr.app.development/com.foodsavr.app/' \
            android/app/src/development/debug/google-services.json \
            > android/app/src/production/debug/google-services.json
      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            adb reverse tcp:8080 tcp:8080
            adb reverse tcp:9099 tcp:9099
            flutter test integration_test --flavor development --no-pub

  e2e-web:
    name: Web E2E (Playwright)
    needs: [changes, web-smoke]
    if: ${{ !cancelled() && needs.web-smoke.result == 'success' && needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: flutter pub get
      - name: Write firebase_options.dart
        run: echo "${{ secrets.FIREBASE_OPTIONS_B64 }}" | base64 -d > lib/firebase_options.dart
      - name: Write minimal .env
        run: echo 'CI_TEST=1' > assets/.env
      - name: Build generative code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Generate web platform files
        run: flutter create . --platforms web
      - name: Build web
        run: flutter build web --release
      - name: Start Firebase Emulators
        run: |
          cat > firebase.json <<'EOT'
          {
            "firestore": {
              "rules": "firestore.rules"
            },
            "emulators": {
              "auth": { "port": 9099 },
              "firestore": { "port": 8080 },
              "ui": { "enabled": true, "port": 4000 }
            }
          }
          EOT
          cat > firestore.rules <<'EOT'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /{document=**} {
                allow read, write: if true;
              }
            }
          }
          EOT
          npx -y firebase-tools@latest emulators:start --project demo-project &
          for i in $(seq 1 60); do
            curl -s http://localhost:4000 > /dev/null && break
            sleep 2
          done
      - name: Serve web build
        run: |
          npx -y serve build/web -l 4173 --no-clipboard &
          for i in $(seq 1 30); do
            curl -s http://localhost:4173 > /dev/null && break
            sleep 1
          done
      - name: Run Playwright E2E tests
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test/e2e/playwright-report/
          retention-days: 7
