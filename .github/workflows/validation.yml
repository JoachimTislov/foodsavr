name: Validation

on:
  push:
    branches: [daily, weekly, stable, 'merge-train/**']
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # Label events other than merge/auto get their own group so they never cancel a running validation.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'merge/auto') && format('-label-{0}', github.run_id) || '' }}
  # See ci-checks.yml: Dependabot runs are not cancelled by their own rebases.
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') || startsWith(github.ref, 'refs/heads/merge-train/') }}

jobs:
  # `Validation result` is a commit status, not a check run: GitHub counts a
  # skipped required check run as passing, but a status that is never posted
  # stays pending. See scripts/ci/validation_status.py.
  validation-hold:
    name: Validation status (hold)
    if: github.event_name == 'pull_request' && github.event.action != 'labeled' && !contains(github.event.pull_request.labels.*.name, 'merge/auto')
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
      - name: Post pending Validation result
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_ACTION: ${{ github.event.action }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: python3 scripts/ci/validation_status.py hold

  validation-start:
    name: Validation status (start)
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'merge/auto')) && (github.event.action != 'labeled' || github.event.label.name == 'merge/auto')
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
      - name: Post pending Validation result
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: python3 scripts/ci/validation_status.py start

  changes:
    name: Detect changed areas
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'merge/auto')) && (github.event.action != 'labeled' || github.event.label.name == 'merge/auto')
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.decide.outputs.web }}
      web_e2e: ${{ steps.decide.outputs.web_e2e }}
      rules: ${{ steps.decide.outputs.rules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') || startsWith(github.ref, 'refs/heads/merge-train/')) && 0 || 1 }}
      - name: Fetch develop base for speculative train diff
        if: startsWith(github.ref, 'refs/heads/merge-train/')
        run: git fetch --no-tags origin develop:refs/heads/develop
      - name: Skip if merged tree or unchanged target already validated
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/already_tested.sh --push-only-reuse \
            --require-job 'Validation status \(result\)' \
            --target 'web:lib,packages,web,assets,pubspec.yaml,pubspec.lock,test/e2e' \
            --target 'rules:firestore-rules,firestore.rules' \
            validation.yml lib packages web assets test/e2e \
            firestore-rules firestore.rules pubspec.yaml pubspec.lock
      - name: Path filters
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ startsWith(github.ref, 'refs/heads/merge-train/') && 'develop' || '' }}
          filters: |
            web:
              - 'lib/**'
              - 'packages/**'
              - 'web/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'test/e2e/**'
            rules:
              - 'firestore-rules/**'
              - 'firestore.rules'
      - name: Classify Dependabot pubspec bump
        id: dep
        if: >
          steps.tested.outputs.skip != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" 2>/dev/null ||
            git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
          python3 scripts/ci/dep_impact.py --base "origin/${{ github.base_ref }}"
      - name: Decide validation targets
        id: decide
        env:
          SKIP: ${{ steps.tested.outputs.skip }}
          SKIP_WEB: ${{ steps.tested.outputs.skip_web }}
          SKIP_RULES: ${{ steps.tested.outputs.skip_rules }}
          EVENT_NAME: ${{ github.event_name }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_RULES: ${{ steps.filter.outputs.rules }}
          DEP_WEB: ${{ steps.dep.outputs.run_web }}
        run: |
          web=false
          web_e2e=false
          rules=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            web=true
            web_e2e=true
            rules=true
          elif [ "$SKIP" != "true" ]; then
            # PRs and pushes get the same smoke and E2E coverage; on PRs dep_impact.py
            # may narrow it to the platforms the change can affect, and already_tested.sh
            # reuses green per-target runs when a synchronize left that target untouched.
            if [ "$SKIP_WEB" != "true" ] && [ "$FILTER_WEB" = "true" ] && [ "$DEP_WEB" != "false" ]; then
              web=true
              web_e2e=true
            fi
            [ "$SKIP_RULES" != "true" ] && [ "$FILTER_RULES" = "true" ] && rules=true
          fi
          {
            echo "web=$web"
            echo "web_e2e=$web_e2e"
            echo "rules=$rules"
          } >> "$GITHUB_OUTPUT"

  web-smoke:
    name: Web smoke test
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: "3.47.6"
          dotenv-content: "CI_TEST=1"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate web platform files
        run: flutter create . --platforms web
      - name: Start Firebase Emulators (background)
        uses: ./.github/actions/start-firebase-emulators
        with:
          mode: start
      - name: Build web
        run: flutter build web --release
      - name: Serve web build
        run: |
          npx -y serve build/web -l 4173 --no-clipboard &
          for i in $(seq 1 30); do
            curl -s http://localhost:4173 > /dev/null && break
            sleep 1
          done
      - name: Install Playwright dependencies
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for Firebase Emulators
        uses: ./.github/actions/start-firebase-emulators
        with:
          mode: wait
      - name: Run Playwright smoke tests
        working-directory: test/e2e
        run: npx playwright test --project=smoke
      - name: Run Playwright E2E tests
        if: ${{ needs.changes.outputs.web_e2e == 'true' }}
        working-directory: test/e2e
        run: npx playwright test --project=chromium
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: test/e2e/playwright-report/
          retention-days: 7

  android-smoke:
    name: Android smoke test
    needs: changes
    # Android checks run only on manual dispatch (`make validate`).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: "3.47.6"
          dotenv-content: "CI_TEST=1"
          write-dummy-google-services: "true"
      - name: Start Firebase Emulators (background)
        uses: ./.github/actions/start-firebase-emulators
        with:
          mode: start
      - name: Cache Android AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-v1
      - name: Build development debug APK
        run: flutter build apk --flavor development --debug --dart-define=EMULATOR_HOST=10.0.2.2
      - name: Wait for Firebase Emulators
        uses: ./.github/actions/start-firebase-emulators
        with:
          mode: wait
      - name: Run Android smoke and integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
          script: |
            bash scripts/ci/android_smoke.sh
            adb reverse tcp:8080 tcp:8080
            adb reverse tcp:9099 tcp:9099
            flutter test integration_test/all_tests.dart --flavor development --no-pub
      - name: Upload emulator screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-visuals
          path: |
            artifacts/android-visuals/
            firebase-emulators.log
          if-no-files-found: warn
          retention-days: 14

  firestore-rules:
    name: Firestore security rules
    needs: changes
    if: ${{ needs.changes.outputs.rules == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: firestore-rules
        run: npm ci
      - name: Start Firestore emulator
        run: |
          cat > firebase.json <<'EOT'
          {
            "firestore": {
              "rules": "firestore.rules"
            },
            "emulators": {
              "firestore": { "port": 8080 }
            }
          }
          EOT
          npx -y firebase-tools@15 emulators:start --project demo-project &
          emulator_up=false
          for _ in $(seq 1 60); do
            if curl -s http://localhost:8080 > /dev/null; then emulator_up=true; break; fi
            sleep 2
          done
          if [ "$emulator_up" != true ]; then
            echo "Firestore emulator did not start" >&2
            exit 1
          fi
      - name: Run rules unit tests
        working-directory: firestore-rules
        run: npx jest --ci

  validation-result:
    name: Validation status (result)
    needs: [validation-start, changes, web-smoke, android-smoke, firestore-rules]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'merge/auto')) && (github.event.action != 'labeled' || github.event.label.name == 'merge/auto') }}
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
      - name: Post final Validation result
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/validation_status.py final
