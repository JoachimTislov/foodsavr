name: Validation

on:
  push:
    branches: [nightly, beta, stable, release]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed areas
    if: (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'merge/auto')) && (github.event.action != 'labeled' || github.event.label.name == 'merge/auto')
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.decide.outputs.web }}
      android: ${{ steps.decide.outputs.android }}
      integration: ${{ steps.decide.outputs.integration }}
      rules: ${{ steps.decide.outputs.rules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') && 0 || 1 }}
      - name: Skip if merged tree already validated on the PR
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/already_tested.sh validation.yml
      - name: Path filters
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            web:
              - 'lib/**'
              - 'packages/**'
              - 'web/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'test/e2e/**'
            android:
              - 'lib/**'
              - 'packages/**'
              - 'android/**'
              - 'assets/**'
              - '.github/workflows/release-gated.yml'
              - '.github/workflows/build-android.yml'
              - 'scripts/release/**'
              - 'scripts/ci/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            integration:
              - 'integration_test/**'
              - 'test_driver/**'
              - 'lib/**'
              - 'packages/**'
              - 'assets/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
            rules:
              - 'firestore-rules/**'
      - name: Classify Dependabot pubspec bump
        id: dep
        if: >
          steps.tested.outputs.skip != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" 2>/dev/null ||
            git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
          python3 scripts/ci/dep_impact.py --base "origin/${{ github.base_ref }}"
      - name: Decide validation targets
        id: decide
        env:
          SKIP: ${{ steps.tested.outputs.skip }}
          EVENT_NAME: ${{ github.event_name }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_ANDROID: ${{ steps.filter.outputs.android }}
          FILTER_INTEGRATION: ${{ steps.filter.outputs.integration }}
          FILTER_RULES: ${{ steps.filter.outputs.rules }}
          DEP_WEB: ${{ steps.dep.outputs.run_web }}
          DEP_ANDROID: ${{ steps.dep.outputs.run_android }}
        run: |
          web=false
          android=false
          integration=false
          rules=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            web=true
            android=true
            integration=true
            rules=true
          elif [ "$SKIP" != "true" ]; then
            [ "$FILTER_WEB" = "true" ] && [ "$DEP_WEB" != "false" ] && web=true
            [ "$FILTER_ANDROID" = "true" ] && [ "$DEP_ANDROID" != "false" ] && android=true
            [ "$FILTER_INTEGRATION" = "true" ] && [ "$DEP_ANDROID" != "false" ] && integration=true
          fi
          [ "$FILTER_RULES" = "true" ] && rules=true
          {
            echo "web=$web"
            echo "android=$android"
            echo "integration=$integration"
            echo "rules=$rules"
          } >> "$GITHUB_OUTPUT"

  web-smoke:
    name: Web smoke test
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: "3.47.6"
          firebase-options-b64: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          dotenv-content: "CI_TEST=1"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate web platform files
        run: flutter create . --platforms web
      - name: Build web
        run: flutter build web --release
      - name: Start Firebase Emulators
        uses: ./.github/actions/start-firebase-emulators
      - name: Serve web build
        run: |
          npx -y serve build/web -l 4173 --no-clipboard &
          for i in $(seq 1 30); do
            curl -s http://localhost:4173 > /dev/null && break
            sleep 1
          done
      - name: Install Playwright dependencies
        working-directory: test/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests
        working-directory: test/e2e
        run: npx playwright test --project=smoke
      - name: Run Playwright E2E tests
        working-directory: test/e2e
        run: npx playwright test --project=chromium
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: test/e2e/playwright-report/
          retention-days: 7

  android-smoke:
    name: Android smoke test
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' || needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: "3.47.6"
          firebase-options-b64: ${{ secrets.FIREBASE_OPTIONS_B64 }}
          dotenv-content: "CI_TEST=1"
          write-dummy-google-services: "true"
      - name: Build development debug APK
        if: ${{ needs.changes.outputs.android == 'true' }}
        run: flutter build apk --flavor development --debug --dart-define=EMULATOR_HOST=10.0.2.2
      - name: Start Firebase Emulators
        uses: ./.github/actions/start-firebase-emulators
      - name: Run Android smoke and integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RUN_ANDROID_SMOKE: ${{ needs.changes.outputs.android }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            [ "$RUN_ANDROID_SMOKE" != "true" ] || bash scripts/ci/android_smoke.sh
            adb reverse tcp:8080 tcp:8080
            adb reverse tcp:9099 tcp:9099
            flutter test integration_test --flavor development --no-pub
      - name: Upload emulator screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-visuals
          path: |
            artifacts/android-visuals/
            firebase-emulators.log
          if-no-files-found: warn
          retention-days: 14

  firestore-rules:
    name: Firestore security rules
    needs: changes
    if: ${{ needs.changes.outputs.rules == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: firestore-rules
        run: npm ci
      - name: Check rules secret availability
        id: rules_secret
        env:
          FIRESTORE_RULES_B64: ${{ secrets.FIRESTORE_RULES_B64 }}
        run: |
          if [ -n "$FIRESTORE_RULES_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIRESTORE_RULES_B64 is not set — skipping rules validation. Set it to activate this gate."
          fi
      - name: Write firestore.rules from secret
        if: steps.rules_secret.outputs.available == 'true'
        env:
          FIRESTORE_RULES_B64: ${{ secrets.FIRESTORE_RULES_B64 }}
        run: |
          echo "$FIRESTORE_RULES_B64" | base64 -d > firestore.rules
          if [ ! -s firestore.rules ]; then
            echo "Decoded firestore.rules is empty — check the secret encoding" >&2
            exit 1
          fi
          # Fail fast if the decoded file is not rules source.
          grep -q "rules_version" firestore.rules || {
            echo "firestore.rules does not look like Firestore rules (missing rules_version)" >&2
            exit 1
          }
      - name: Start Firestore emulator
        if: steps.rules_secret.outputs.available == 'true'
        run: |
          cat > firebase.json <<'EOT'
          {
            "firestore": {
              "rules": "firestore.rules"
            },
            "emulators": {
              "firestore": { "port": 8080 }
            }
          }
          EOT
          npx -y firebase-tools@15 emulators:start --project demo-project &
          emulator_up=false
          for _ in $(seq 1 60); do
            if curl -s http://localhost:8080 > /dev/null; then emulator_up=true; break; fi
            sleep 2
          done
          if [ "$emulator_up" != true ]; then
            echo "Firestore emulator did not start" >&2
            exit 1
          fi
      - name: Run rules unit tests
        if: steps.rules_secret.outputs.available == 'true'
        working-directory: firestore-rules
        run: npx jest --ci
