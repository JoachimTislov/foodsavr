name: Manual Tools

# On-demand developer utilities (#496), dispatch only. Pick the tool; each job runs
# only for its own tool.
#
# - android-drive-test: builds the installable test APK for a ref and uploads it to
#   Google Drive (scripts/release/android_drive.sh; `make android-apk`).

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to run
        type: choice
        required: true
        options: [android-drive-test]
      ref:
        description: "android-drive-test: git ref to build"
        required: false
        default: stable
        type: string

run-name: "${{ format('Manual Tools: {0}', inputs.tool) }}"

permissions:
  contents: read

jobs:
  android-drive-test:
    name: Build and upload test APK
    if: inputs.tool == 'android-drive-test'
    concurrency:
      group: android-drive-test
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
      ANDROID_ENV_B64: ${{ secrets.ANDROID_ENV_B64 }}
      FIREBASE_DEFINES: ${{ vars.FIREBASE_DEFINES_TEST }}
    steps:
      - name: Check Drive configuration
        run: |
          test -n "$GOOGLE_DRIVE_FOLDER_ID" || { echo '::error::Missing GOOGLE_DRIVE_FOLDER_ID'; exit 1; }
          test -n "$GOOGLE_DRIVE_OAUTH_JSON" || { echo '::error::Missing GOOGLE_DRIVE_OAUTH_JSON'; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Build installable test APK
        run: bash scripts/release/android_drive.sh build

      - name: Upload APK to Google Drive
        run: bash scripts/release/android_drive.sh upload
