name: Merge gate

# Integrates opted-in PRs from trusted authors into develop, one at a time (ADR 0006, ADR 0007, ADR 0008).
# Level-triggered: each run reconciles the whole queue on PR verification completion,
# PR readiness (opened non-draft, ready_for_review, labeled merge/auto), pushes, or
# schedule. Every PR check now runs in the single `Pull Request` workflow, so one
# completion wakes the gate instead of six. A finished adaptive review dispatches the
# gate from agent-ops.yml rather than through a second workflow_run subscription.
on:
  workflow_run:
    workflows: ["Pull Request"]
    types: [completed]
  pull_request_target:
    types: [opened, ready_for_review, labeled]
  push:
    branches: [develop]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR readiness/label events and Dependabot-triggered CI (no repository secrets)
  # only dispatch a gate run on develop; no PR code is checked out and forks are ignored.
  dispatch:
    name: Request gate run
    if: >-
      (github.event_name == 'pull_request_target' &&
       !github.event.pull_request.head.repo.fork &&
       ((github.event.action == 'labeled' && (github.event.label.name == 'merge/auto' || github.event.label.name == 'merge/priority')) ||
        github.event.action == 'ready_for_review' ||
        (github.event.action == 'opened' && !github.event.pull_request.draft))) ||
      (github.event_name == 'workflow_run' &&
       github.actor == 'dependabot[bot]' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run merge-gate.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}" ||
            echo "::warning::Could not dispatch the merge gate; the schedule will run it."

  gate:
    name: Integrate ready PRs
    # Dependabot-triggered events get no repository secrets; `dispatch` covers them.
    # Ignore non-PR or non-success workflow_run completions so failed/cancelled/release
    # runs do not fan out redundant gate executions.
    if: >-
      github.event_name != 'pull_request_target' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'))
    # No concurrency group: cancelled queued runs would mark develop red. The
    # script serializes instead (older runs finish first, superseded ones exit).
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Release-Gate App configuration
        id: app-config
        env:
          RELEASE_GATE_APP_ID: ${{ vars.RELEASE_GATE_APP_ID || secrets.RELEASE_GATE_APP_ID }}
          RELEASE_GATE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_GATE_APP_PRIVATE_KEY }}
          HAS_LEGACY_TOKEN: ${{ secrets.MERGE_GATE_TOKEN != '' }}
        run: |
          if [ -n "$RELEASE_GATE_APP_ID" ] && [ -n "$RELEASE_GATE_APP_PRIVATE_KEY" ]; then
            if ! printf '%s\n' "$RELEASE_GATE_APP_PRIVATE_KEY" | grep -q -- '-----BEGIN .*PRIVATE KEY-----'; then
              echo "::error::RELEASE_GATE_APP_PRIVATE_KEY is not a valid PEM private key. Re-upload the GitHub App .pem file with scripts/secrets/rotate.py RELEASE_GATE_APP_PRIVATE_KEY."
              exit 1
            fi
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_LEGACY_TOKEN" == true ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merge gate skipped. Configure the Release-Gate App or MERGE_GATE_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Mint Release-Gate App token
        id: gate-app
        if: steps.app-config.outputs.app == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_GATE_APP_ID || secrets.RELEASE_GATE_APP_ID }}
          private-key: ${{ secrets.RELEASE_GATE_APP_PRIVATE_KEY }}

      - name: Checkout trusted gate
        if: steps.app-config.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load review history from the history branch
        if: steps.app-config.outputs.ready == 'true'
        env:
          HISTORY_TOKEN: ${{ github.token }}
        run: scripts/github/review_history.sh fetch "$HISTORY_TOKEN"

      - name: Reconcile merge queue
        if: steps.app-config.outputs.ready == 'true'
        env:
          # Must not be GITHUB_TOKEN: its merges and pushes trigger no workflows.
          GH_TOKEN: ${{ steps.gate-app.outputs.token || secrets.MERGE_GATE_TOKEN }}
          RUNS_TOKEN: ${{ github.token }}
          AGENT_APP_SLUG: ${{ vars.AGENT_APP_SLUG }}
          MERGE_GATE_FREEZE: ${{ vars.MERGE_GATE_FREEZE }}
          MERGE_TRAIN_DEPTH: ${{ vars.MERGE_TRAIN_DEPTH }}
        run: python3 scripts/github/merge_gate.py --repo "${{ github.repository }}" --apply
