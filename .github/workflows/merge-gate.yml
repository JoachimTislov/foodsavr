name: Merge gate

# Integrates opted-in PRs from trusted authors into develop, one at a time (ADR 0006).
# Level-triggered: each run reconciles the whole queue on CI completion, PR
# readiness (opened non-draft, ready_for_review, labeled merge/auto), pushes, or schedule.
on:
  workflow_run:
    workflows:
      - "Format, Analyze, Check Localizations and Run Tests"
      - "Validation"
      - "Web Build"
      - "Android Build"
      - "Agent system validation"
      - "Agent review"
      - "Documentation Pages"
      - "Dependency Review"
    types: [completed]
  pull_request_target:
    types: [opened, ready_for_review, labeled]
  push:
    branches: [develop]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # PR readiness/label events and Dependabot-triggered CI (no repository secrets)
  # only dispatch a gate run on develop; no PR code is checked out and forks are ignored.
  dispatch:
    name: Request gate run
    if: >-
      (github.event_name == 'pull_request_target' &&
       !github.event.pull_request.head.repo.fork &&
       ((github.event.action == 'labeled' && github.event.label.name == 'merge/auto') ||
        github.event.action == 'ready_for_review' ||
        (github.event.action == 'opened' && !github.event.pull_request.draft))) ||
      (github.event_name == 'workflow_run' && github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run merge-gate.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}" ||
            echo "::warning::Could not dispatch the merge gate; the schedule will run it."

  gate:
    name: Integrate ready PRs
    # Dependabot-triggered events get no repository secrets; `dispatch` covers them.
    if: github.event_name != 'pull_request_target' && github.actor != 'dependabot[bot]'
    # No concurrency group: cancelled queued runs would mark develop red. The
    # script serializes instead (older runs finish first, superseded ones exit).
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Load review history from the history branch
        env:
          HISTORY_TOKEN: ${{ github.token }}
        run: scripts/github/review_history.sh fetch "$HISTORY_TOKEN"
      - name: Reconcile merge queue
        env:
          # Must not be GITHUB_TOKEN: its merges and pushes trigger no workflows.
          GH_TOKEN: ${{ secrets.MERGE_GATE_TOKEN }}
          RUNS_TOKEN: ${{ github.token }}
          AGENT_APP_SLUG: ${{ vars.AGENT_APP_SLUG }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MERGE_GATE_TOKEN is not set; run scripts/secrets/rotate.py MERGE_GATE_TOKEN"
            exit 1
          fi
          python3 scripts/github/merge_gate.py --repo "${{ github.repository }}" --apply
