name: Merge gate

# Integrates PRs labeled merge/auto into main, one at a time (ADR 0006).
# Level-triggered: each run reconciles the whole queue, so any event is enough.
on:
  workflow_run:
    workflows:
      - "Format, Analyze, Check Localizations and Run Tests"
      - "Validation"
      - "Web Build"
      - "Android Build"
      - "Agent system validation"
      - "Documentation Pages"
      - "Dependency Review"
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-gate
  cancel-in-progress: false

jobs:
  gate:
    name: Integrate ready PRs
    # Dependabot-triggered events get no repository secrets; the schedule covers them.
    if: >
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request_target' ||
       github.event.action != 'labeled' || github.event.label.name == 'merge/auto')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile merge queue
        env:
          # Must not be GITHUB_TOKEN: its merges and pushes trigger no workflows.
          GH_TOKEN: ${{ secrets.MERGE_GATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MERGE_GATE_TOKEN is not set; run scripts/secrets/rotate.py MERGE_GATE_TOKEN"
            exit 1
          fi
          python3 scripts/github/merge_gate.py --repo "${{ github.repository }}" --apply
