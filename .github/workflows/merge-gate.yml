name: Merge gate

# Integrates PRs labeled merge/auto into main, one at a time (ADR 0006).
# Level-triggered: each run reconciles the whole queue, so any event is enough.
on:
  workflow_run:
    workflows:
      - "Format, Analyze, Check Localizations and Run Tests"
      - "Validation"
      - "Web Build"
      - "Android Build"
      - "Agent system validation"
      - "Documentation Pages"
      - "Dependency Review"
    types: [completed]
  pull_request_target:
    types: [labeled]
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs attached to a PR only dispatch; the gate itself runs on main, so its
  # queued or cancelled runs never show up as checks on PRs.
  dispatch:
    name: Request gate run
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'merge/auto'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run merge-gate.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"

  gate:
    name: Integrate ready PRs
    # Dependabot-triggered events get no repository secrets; the schedule covers them.
    if: github.event_name != 'pull_request_target' && github.actor != 'dependabot[bot]'
    # No concurrency group: cancelled queued runs would mark main red. The
    # script serializes instead (older runs finish first, superseded ones exit).
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted gate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile merge queue
        env:
          # Must not be GITHUB_TOKEN: its merges and pushes trigger no workflows.
          GH_TOKEN: ${{ secrets.MERGE_GATE_TOKEN }}
          RUNS_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::MERGE_GATE_TOKEN is not set; run scripts/secrets/rotate.py MERGE_GATE_TOKEN"
            exit 1
          fi
          python3 scripts/github/merge_gate.py --repo "${{ github.repository }}" --apply
