name: Documentation Pages

on:
  push:
    branches: [main]
    paths: &docs-paths
      - 'doc/**'
      - 'specs/source-of-truth/**'
      - 'assets/logos/**'
      - '*.md'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - 'scripts/ci/local_ci.py'
      - '.github/workflows/docs-pages.yml'
  pull_request:
    branches: [main]
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install documentation tools
        run: python -m pip install -r scripts/docs/requirements.txt
      - name: Build and check documentation
        env:
          LOCAL_CI_PYTHON: python
        run: python scripts/ci/local_ci.py --group docs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site

  deploy:
    name: Publish documentation
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
