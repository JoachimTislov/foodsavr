name: Android delivery

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string

permissions:
  contents: read

# Avoid concurrent Google Play edits from separate releases.
concurrency:
  group: android-internal-delivery
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK and App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_code: ${{ steps.version.outputs.code }}
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: Restore signing and backend configuration
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_FIREBASE_OPTIONS_B64: ${{ secrets.ANDROID_FIREBASE_OPTIONS_B64 }}
          ANDROID_GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_B64 }}
          ANDROID_ENV_B64: ${{ secrets.ANDROID_ENV_B64 }}
        run: python3 scripts/release/prepare_android.py
      - name: Assign Android version code
        id: version
        env:
          VERSION_BASE: ${{ vars.ANDROID_VERSION_CODE_BASE || '100000' }}
        run: |
          python3 - <<'PY'
          import os
          code = int(os.environ['VERSION_BASE']) + int(os.environ['GITHUB_RUN_NUMBER'])
          if not 0 < code <= 2100000000:
              raise SystemExit('Android version code is out of range')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'code={code}\n')
          PY
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build installable APK and Play Store bundle
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          flutter build apk --flavor production --release --build-number="$VERSION_CODE"
          flutter build appbundle --flavor production --release --build-number="$VERSION_CODE"
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-production-release.apk "artifacts/foodsavr-$VERSION_CODE.apk"
          cp build/app/outputs/bundle/productionRelease/app-production-release.aab "artifacts/foodsavr-$VERSION_CODE.aab"
          sha256sum artifacts/* > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-${{ steps.version.outputs.code }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/android-upload.jks"

  drive:
    name: Upload APK to Google Drive
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: android-signed-${{ needs.build.outputs.version_code }}
          path: artifacts/
      - name: Upload APK and print download link
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: python3 scripts/release/upload_drive.py "artifacts/foodsavr-$VERSION_CODE.apk"

  play:
    name: Publish App Bundle to Play internal testing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-signed-${{ needs.build.outputs.version_code }}
          path: artifacts/
      - name: Check Play credentials
        env:
          PLAY_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_CREDENTIALS" ]; then
            echo '::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret'
            exit 1
          fi
      - name: Upload to internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.foodsavr.app
          releaseFiles: artifacts/foodsavr-${{ needs.build.outputs.version_code }}.aab
          track: internal
          status: completed
