name: Firebase Hosting

# Builds the web app for one environment (flavor) of deploy/instance.yaml and
# deploys it to that environment's Firebase Hosting site. Project, web app,
# site and FLAVOR come from the manifest (`levels env`), so forks only edit
# the manifest. Deployments are disabled unless the owner explicitly sets
# FIREBASE_HOSTING_ENABLED=true. Once enabled, pushes to stable deploy production
# live. Previews are manual only: Actions -> Firebase Hosting -> Run workflow on
# a branch (target: preview) deploys a short-lived channel (default 4h) named
# after the branch and comments on its PR; environment `auto` picks staging when
# the manifest declares a cloud staging environment, else production.
# Independent of the Android Drive/Play workflows.
#
# Build and deploy logic lives in scripts/web/deploy_web.py, shared with the
# manual bypass `make deploy-web ENV=<env> [TARGET=live|preview]`, which runs
# the same steps with your own firebase login. When enabled but the deploy
# configuration is missing, the job fails (no silent green) and names both the
# bypass and the fix (`make infra-gcp-apply ENV=<env>`).
#
# Storage budget (scripts/web/hosting_storage_guard.py, before each deploy):
# previews are deleted oldest-first above 8 GB and skipped if they would
# not fit; live deploys may also delete live versions older than the 3
# latest to stay under 10 GB.
#
# Auth is keyless (Workload Identity Federation, see infra/terraform).
# Variables:
#   FIREBASE_HOSTING_ENABLED        explicit owner opt-in; unset/false skips all deploys
#   WEB_ACCESS_CODE                  optional public code compiled into the hosted app
# Variables set by scripts/infra/apply.sh (non-production environments use
# a suffix, e.g. GCP_DEPLOY_SERVICE_ACCOUNT_STAGING):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  required to deploy (missing fails the job when enabled)
#   GCP_DEPLOY_SERVICE_ACCOUNT      required to deploy (missing fails the job when enabled)
#   RECAPTCHA_ENTERPRISE_SITE_KEY   optional; App Check web site key (public)
#   ANDROID_APK_URL                 optional; /android redirects here
# Secrets:
#   WEB_ENV_B64                     optional; assets/.env (served publicly)

on:
  push:
    branches: [stable, develop]
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "packages/**"
      - ".github/workflows/firebase-hosting.yml"
      - "scripts/web/**"
      - "deploy/instance.yaml"
  workflow_dispatch:
    inputs:
      target:
        description: "preview (short-lived channel for this branch) or live"
        type: choice
        options: [preview, live]
        default: preview
      environment:
        description: "Environment (flavor); auto = staging for previews if declared, else production"
        type: choice
        options: [auto, production, staging, test]
        default: auto
      expires:
        description: "Preview lifetime (e.g. 2h, 12h, 1d; max 30d)"
        type: string
        default: 4h

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FIREBASE_TOOLS: firebase-tools@15
  TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'live' }}

jobs:
  resolve:
    name: Resolve environment from deploy/instance.yaml
    if: >-
      vars.FIREBASE_HOSTING_ENABLED == 'true' &&
      (github.event_name != 'push' ||
       github.ref == 'refs/heads/stable' ||
       (github.ref == 'refs/heads/develop' &&
        (vars.RELEASE_TOPOLOGY == 'single' ||
         (vars.RELEASE_TOPOLOGY == '' && github.repository != 'JoachimTislov/foodsavr'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      flavor: ${{ steps.env.outputs.FLAVOR }}
      suffix: ${{ steps.env.outputs.VAR_SUFFIX }}
      project_id: ${{ steps.env.outputs.PROJECT_ID }}
      web_app_id: ${{ steps.env.outputs.WEB_APP_ID }}
      site_id: ${{ steps.env.outputs.SITE_ID }}
      github_environment: ${{ steps.env.outputs.GH_ENVIRONMENT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Resolve environment
        id: env
        working-directory: packages/foodsavr_deploy
        env:
          REQUESTED: ${{ inputs.environment || 'auto' }}
        run: |
          dart pub get
          env_name="$REQUESTED"
          if [ "$env_name" = auto ]; then
            env_name=production
            if [ "$TARGET" = preview ] && dart run bin/levels.dart environments --cloud | grep -q '^staging '; then
              env_name=staging
            fi
          fi
          dart run bin/levels.dart env --env "$env_name" --format github | tee -a "$GITHUB_OUTPUT"
          grep -q '^PROJECT_ID=' "$GITHUB_OUTPUT" || { echo "::error::$env_name has no cloud (Firebase) identity"; exit 1; }
          echo "Environment: $env_name" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build and deploy to Firebase Hosting
    needs: resolve
    environment: ${{ needs.resolve.outputs.github_environment || needs.resolve.outputs.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      PROJECT_ID: ${{ needs.resolve.outputs.project_id }}
      WEB_APP_ID: ${{ needs.resolve.outputs.web_app_id }}
      SITE_ID: ${{ needs.resolve.outputs.site_id }}
      FLAVOR: ${{ needs.resolve.outputs.flavor }}
      WIF_PROVIDER: ${{ vars[format('GCP_WORKLOAD_IDENTITY_PROVIDER{0}', needs.resolve.outputs.suffix)] }}
      DEPLOY_SA: ${{ vars[format('GCP_DEPLOY_SERVICE_ACCOUNT{0}', needs.resolve.outputs.suffix)] }}
      HAS_DEPLOY_CONFIG: ${{ vars[format('GCP_WORKLOAD_IDENTITY_PROVIDER{0}', needs.resolve.outputs.suffix)] != '' && vars[format('GCP_DEPLOY_SERVICE_ACCOUNT{0}', needs.resolve.outputs.suffix)] != '' }}
    steps:
      - name: Require deploy configuration
        if: ${{ env.HAS_DEPLOY_CONFIG != 'true' }}
        env:
          SUFFIX: ${{ needs.resolve.outputs.suffix }}
        run: |
          msg="FIREBASE_HOSTING_ENABLED=true but GCP_WORKLOAD_IDENTITY_PROVIDER/GCP_DEPLOY_SERVICE_ACCOUNT (suffix '$SUFFIX') are missing, so nothing was deployed. Deploy now: make deploy-web ENV=$FLAVOR. Fix the pipeline: make infra-gcp-apply ENV=$FLAVOR."
          echo "::error::$msg"
          echo "❌ $msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (keyless)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Build web
        env:
          WEB_ENV_B64: ${{ secrets.WEB_ENV_B64 }}
          ANDROID_APK_URL: ${{ vars.ANDROID_APK_URL }}
          RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars[format('RECAPTCHA_ENTERPRISE_SITE_KEY{0}', needs.resolve.outputs.suffix)] }}
          WEB_ACCESS_CODE: ${{ vars.WEB_ACCESS_CODE }}
          FIREBASE_PLAN: ${{ vars.FIREBASE_PLAN }}
          ERROR_REPORTER: ${{ vars.ERROR_REPORTER }}
          ERROR_COLLECTOR_ENDPOINT: ${{ vars.ERROR_COLLECTOR_ENDPOINT }}
        run: python3 scripts/web/deploy_web.py build

      - name: Upload web source maps (Blaze)
        if: ${{ env.TARGET == 'live' && vars.FIREBASE_PLAN == 'blaze' }}
        run: python3 scripts/web/deploy_web.py sourcemaps

      - name: Check Hosting storage budget
        id: budget
        env:
          BRANCH: ${{ github.ref_name }}
        run: python3 scripts/web/deploy_web.py guard

      - name: Deploy preview channel
        if: ${{ env.TARGET == 'preview' && steps.budget.outputs.fits == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          EXPIRES: ${{ inputs.expires }}
        run: python3 scripts/web/deploy_web.py deploy

      - name: Deploy live
        if: ${{ env.TARGET == 'live' }}
        run: python3 scripts/web/deploy_web.py deploy
