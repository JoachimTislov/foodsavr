name: Firebase Hosting

# Builds the production-flavor web app and deploys it to Firebase Hosting
# (my-foodsavr-store). Deployments are disabled unless the owner explicitly sets
# FIREBASE_HOSTING_ENABLED=true. Once enabled, pushes to main go live.
# Previews are manual only:
# Actions -> Firebase Hosting -> Run workflow on a branch (target: preview)
# deploys a short-lived channel (default 4h) named after the branch and
# comments on its PR.
# Independent of the Android Drive/Play workflows.
#
# Storage budget (scripts/web/hosting_storage_guard.py, before each deploy):
# previews are deleted oldest-first above 8 GB and skipped if they would
# not fit; live deploys may also delete live versions older than the 3
# latest to stay under 10 GB.
#
# Auth is keyless (Workload Identity Federation, see infra/terraform).
# Variables:
#   FIREBASE_HOSTING_ENABLED        explicit owner opt-in; unset/false skips all deploys
# Variables set by scripts/infra/apply.sh:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  required to deploy (else skipped)
#   GCP_DEPLOY_SERVICE_ACCOUNT      required to deploy (else skipped)
#   RECAPTCHA_ENTERPRISE_SITE_KEY   optional; App Check web site key (public)
#   ANDROID_APK_URL                 optional; /android redirects here
# Secrets:
#   WEB_ENV_B64                     optional; assets/.env (served publicly)

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "packages/**"
      - ".github/workflows/firebase-hosting.yml"
      - "scripts/web/**"
  workflow_dispatch:
    inputs:
      target:
        description: "preview (short-lived channel for this branch) or live"
        type: choice
        options: [preview, live]
        default: preview
      expires:
        description: "Preview lifetime (e.g. 2h, 12h, 1d; max 30d)"
        type: string
        default: 4h

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_ID: my-foodsavr-store
  WEB_APP_ID: "1:514586238925:web:e562b8b85d97417f83ae84"
  FIREBASE_TOOLS: firebase-tools@15

jobs:
  deploy:
    name: Build and deploy to Firebase Hosting
    if: ${{ vars.FIREBASE_HOSTING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      HAS_DEPLOY_CONFIG: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'live' }}
    steps:
      - name: Skip without deploy configuration
        if: ${{ env.HAS_DEPLOY_CONFIG != 'true' }}
        run: |
          echo "::warning::GCP_WORKLOAD_IDENTITY_PROVIDER or GCP_DEPLOY_SERVICE_ACCOUNT is missing; run scripts/infra/apply.sh. Skipping Firebase Hosting deploy."
          echo '⚠️ Firebase Hosting deploy skipped: run scripts/infra/apply.sh.' >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        if: ${{ env.HAS_DEPLOY_CONFIG == 'true' }}
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (keyless)
        if: ${{ env.HAS_DEPLOY_CONFIG == 'true' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Flutter
        if: ${{ env.HAS_DEPLOY_CONFIG == 'true' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Generate web configuration
        if: ${{ env.HAS_DEPLOY_CONFIG == 'true' }}
        env:
          WEB_ENV_B64: ${{ secrets.WEB_ENV_B64 }}
          ANDROID_APK_URL: ${{ vars.ANDROID_APK_URL }}
        run: |
          npx -y "$FIREBASE_TOOLS" apps:sdkconfig WEB "$WEB_APP_ID" --project "$PROJECT_ID" --json \
            | python3 scripts/web/write_web_config.py
          if [ -n "$WEB_ENV_B64" ]; then
            printf '%s' "$WEB_ENV_B64" | base64 --decode > assets/.env
          else
            echo "::warning::WEB_ENV_B64 is missing; deploying with an empty assets/.env."
            : > assets/.env
          fi

      - name: Build web
        if: ${{ env.HAS_DEPLOY_CONFIG == 'true' }}
        env:
          RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter create . --platforms web
          defines=(--dart-define=FLAVOR=production)
          if [ -n "$RECAPTCHA_ENTERPRISE_SITE_KEY" ]; then
            defines+=("--dart-define=RECAPTCHA_ENTERPRISE_SITE_KEY=$RECAPTCHA_ENTERPRISE_SITE_KEY")
          else
            echo "::warning::RECAPTCHA_ENTERPRISE_SITE_KEY is missing; App Check uses a placeholder key."
          fi
          flutter build web --release "${defines[@]}"

      - name: Check Hosting storage budget
        id: budget
        if: ${{ env.HAS_DEPLOY_CONFIG == 'true' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          channel=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-27 | sed 's/^-*//;s/-*$//')
          digest=$(printf '%s' "$BRANCH" | sha256sum | cut -c1-12)
          channel="${channel:-branch}-$digest"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          set +e
          keep=""; [ "$TARGET" = preview ] && keep="$channel"
          KEEP_CHANNEL="$keep" python3 scripts/web/hosting_storage_guard.py "$TARGET" "$(du -sb build/web | cut -f1)"
          code=$?
          set -e
          if [ "$code" = 3 ]; then echo "fits=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$code" = 0 ] && echo "fits=true" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Deploy preview channel
        if: ${{ env.HAS_DEPLOY_CONFIG == 'true' && env.TARGET == 'preview' && steps.budget.outputs.fits == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          EXPIRES: ${{ inputs.expires }}
        run: |
          [[ "$EXPIRES" =~ ^[0-9]+[hdw]$ ]] || { echo "::error::expires must look like 4h, 1d or 2w"; exit 1; }
          channel="${{ steps.budget.outputs.channel }}"
          url=$(npx -y "$FIREBASE_TOOLS" hosting:channel:deploy "$channel" --expires "$EXPIRES" \
            --project "$PROJECT_ID" --json | python3 -c 'import json,sys; print(next(iter(json.load(sys.stdin)["result"].values()))["url"])')
          echo "Preview: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
              --body "🔥 Firebase Hosting preview (expires in $EXPIRES): $url"
          fi

      - name: Deploy live
        if: ${{ env.HAS_DEPLOY_CONFIG == 'true' && env.TARGET == 'live' }}
        run: |
          npx -y "$FIREBASE_TOOLS" deploy --only hosting --project "$PROJECT_ID" --non-interactive
          echo "Live: https://$PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
