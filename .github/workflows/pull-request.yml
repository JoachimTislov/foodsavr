name: Pull Request

# One verification workflow for develop PRs, release-channel pushes and speculative
# merge-train refs (#496). It replaces pr-base, traceability, dependency-review,
# ci-checks, agent-system, the docs-pages build, validation and the deployment-level
# PR check, so a PR update boots one workflow instead of eight.
#
# Stage 1, `Decide whether to run CI` (required check): PR base freshness, commit
#   traceability and event logs, dependency review, then every suite decision. A
#   failed preflight fails this required check, so the skipped suites behind it never
#   count as passing (ADR 0006).
# Stage 2: `Check & Test` (required), release scripts, agent system, documentation
#   build and the deployment-levels CLI, each only for the paths it covers. The
#   decisions come from scripts/ci/local_ci.py --ci-filters, the same paths
#   `make check` uses locally.
# Stage 3: Validation (Playwright, Firestore rules), started on PRs by `merge/auto`,
#   or automatically on every non-draft PR when the repository variable
#   SELF_MANAGED_MERGE is `true`, and always on pushes. Develop PRs and merge-train refs run the relational Dart
#   tests and Playwright smoke. `daily` pushes and dispatch run the full Dart suite
#   with coverage and the full Playwright suite (desktop and mobile); `weekly` and
#   `stable` reuse that evidence for the same SHA, else run it themselves. The suites
#   live in _reusable-dart-checks.yml and _reusable-web-playwright.yml. Android smoke
#   + integration run only on manual dispatch
#   (`make validate`); `Validation result` succeeds without them. `Validation result`
#   is a commit status, not a check run: GitHub counts a skipped required check run
#   as passing, but a status that is never posted stays pending
#   (scripts/ci/validation_status.py).
#
# Label and edit events run the same graph on the same head. Their suites skip only
# where another run on this head already passed them, so a newer skipped check run
# never hides an older failure of a required check.

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled]
  push:
    branches: [daily, weekly, stable, 'merge-train/**']
  schedule:
    # Weekly agent-system validation on develop.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      operation:
        description: "all: every suite and Validation; checks: Check & Test (full suite), agent system, docs, release scripts, levels CLI; validation: Validation only"
        type: choice
        options: [all, checks, validation]
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new head cancels the running one. Label and edit events wait for it instead and
  # then reuse its results, so they never cancel a running validation. Dependabot
  # rebases keep the running check: the next run reuses it when nothing in scope changed.
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.event.action != 'edited' && github.event.action != 'labeled' && github.event.action != 'ready_for_review') || startsWith(github.ref, 'refs/heads/merge-train/') }}

jobs:
  gate:
    name: Decide whether to run CI
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      run_release: ${{ steps.decide.outputs.run_release }}
      agents: ${{ steps.decide.outputs.agents }}
      docs: ${{ steps.decide.outputs.docs }}
      deploy: ${{ steps.decide.outputs.deploy }}
      validate: ${{ steps.decide.outputs.validate }}
      web: ${{ steps.decide.outputs.web }}
      rules: ${{ steps.decide.outputs.rules }}
      full: ${{ steps.decide.outputs.full }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_ACTION: ${{ github.event.action }}
      CONTENT_EVENT: ${{ github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action) }}
      # PRs that validate without another opt-in; the others hold `Validation result`.
      AUTO_VALIDATE: ${{ contains(github.event.pull_request.labels.*.name, 'merge/auto') || (vars.SELF_MANAGED_MERGE == 'true' && !github.event.pull_request.draft) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Post pending Validation result (hold)
        if: env.CONTENT_EVENT == 'true' && env.AUTO_VALIDATE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: python3 scripts/ci/validation_status.py hold

      - name: "Preflight: branch contains latest base"
        if: github.event_name == 'pull_request'
        run: python3 scripts/ci/check_pr_base.py "${{ github.base_ref }}"

      # Every PR needs an owner: an `Agent-Session:` trailer on each commit, or an
      # `Agent-Session:` line in the PR body (`none (human)` declares a human author).
      # Dependabot and other bots are exempt. See .agents/sessions/README.md.
      - name: "Preflight: agent session declared"
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/agents/agentctl check-pr --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: "Preflight: validate agent event logs"
        if: github.event_name == 'pull_request'
        run: python3 scripts/agents/check_logs.py

      - name: Changed paths
        id: paths
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          IS_TRAIN: ${{ startsWith(github.ref, 'refs/heads/merge-train/') }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$IS_TRAIN" = true ]; then
            git fetch --no-tags origin develop
            base=origin/develop
          else
            base="$BEFORE"
          fi
          # A new branch or unknown base puts every suite in scope. pipefail: when the
          # classifier fails before writing its decisions, this preflight check must
          # fail instead of passing tee's exit status.
          set -o pipefail
          python3 scripts/ci/local_ci.py --ci-filters "$base" HEAD | tee -a "$GITHUB_OUTPUT"

      - name: "Preflight: review dependency changes"
        if: github.event_name == 'pull_request' && steps.paths.outputs.deps == 'true'
        uses: actions/dependency-review-action@v4

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          REF: ${{ github.ref }}
          LABEL: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DART: ${{ steps.paths.outputs.dart }}
          RELEASE: ${{ steps.paths.outputs.release }}
          AGENTS: ${{ steps.paths.outputs.agents }}
          DOCS: ${{ steps.paths.outputs.docs }}
          INFRA: ${{ steps.paths.outputs.infra }}
          WEB: ${{ steps.paths.outputs.web }}
          RULES: ${{ steps.paths.outputs.rules }}
        run: |
          run=false run_release=false agents=false docs=false deploy=false validate=false full=false
          web="${WEB:-false}" rules="${RULES:-false}"
          train=false
          [[ "$REF" == refs/heads/merge-train/* ]] && train=true

          # Check & Test reuses a green previous head (synchronize), the merged PR head
          # (push), or the speculative train tree; scope must match the `dart` group.
          check_and_test() {
            local tmp
            tmp="$(mktemp)"
            GITHUB_OUTPUT="$tmp" scripts/ci/already_tested.sh \
              --require-job '^Check & Test$' --substantive-job '^Check & Test$' \
              --pr-reuse-jobs '^(Decide whether to run CI|Check & Test)$' \
              pull-request.yml ':(glob)**/*.dart' lib packages test assets \
              pubspec.yaml pubspec.lock analysis_options.yaml integration_test test_driver \
              .github/workflows/_reusable-dart-checks.yml
            if grep -q '^skip=true$' "$tmp"; then echo false; else echo true; fi
          }

          # weekly and stable reuse only a full suite that passed on a push of this SHA.
          full_check_and_test() {
            local tmp
            tmp="$(mktemp)"
            GITHUB_OUTPUT="$tmp" scripts/ci/already_tested.sh --push-only-reuse \
              --require-job '(^| / )Full Dart suite$' --substantive-job '(^| / )Full Dart suite$' \
              pull-request.yml
            if grep -q '^skip=true$' "$tmp"; then echo false; else echo true; fi
          }

          # Jobs that already succeeded on this head in another run of this workflow.
          passed=""
          if [ "$EVENT_NAME" = pull_request ] && [ "$CONTENT_EVENT" != true ]; then
            passed="$(python3 scripts/ci/head_jobs.py --workflow pull-request.yml --sha "$HEAD_SHA" --exclude-run "$GITHUB_RUN_ID")"
          fi
          needed() {  # needed <path decision> <job name>: in scope and not yet green on this head
            [ "$1" = true ] && ! grep -Fxq "$2" <<< "$passed"
          }

          case "$EVENT_NAME" in
            pull_request)
              if [ "$CONTENT_EVENT" = true ]; then
                [ "$DART" = true ] && run="$(check_and_test)"
                run_release="$RELEASE" agents="$AGENTS" docs="$DOCS" deploy="$INFRA"
                validate="$AUTO_VALIDATE"
              else
                # Label, edit and ready events: a pending run they replaced may never have run.
                needed "$DART" "Check & Test" && run=true
                needed "$RELEASE" "Check release scripts" && run_release=true
                needed "$AGENTS" "Agent system validation" && agents=true
                needed "$DOCS" "Build documentation" && docs=true
                needed "$INFRA" "Validate manifests and test levels CLI" && deploy=true
                if [ "$PR_ACTION" = labeled ] && [ "$LABEL" = merge/auto ]; then
                  validate=true
                elif [ "$AUTO_VALIDATE" = true ]; then
                  # Start Validation only if no validating run reported on this head.
                  status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/statuses" \
                    --jq '[.[] | select(.context == "Validation result")][0].description // ""')"
                  if [ -z "$status" ] || [ "$status" = "Add merge/auto to run Validation" ]; then validate=true; fi
                fi
              fi
              ;;
            push)
              validate=true
              case "$REF" in
                refs/heads/daily)
                  # Nightly: always the full suites, whatever the push touched.
                  full=true run=true web=true
                  ;;
                refs/heads/weekly|refs/heads/stable)
                  full=true
                  [ "$DART" = true ] && run="$(full_check_and_test)"
                  ;;
                *)
                  [ "$DART" = true ] && run="$(check_and_test)"
                  ;;
              esac
              if [ "$train" != true ]; then
                run_release=true
                # Agent validation is a develop-PR and weekly-schedule check, not a
                # documented release prerequisite: release.yml gates stable releases on
                # Check & Test and Validation only, so the agent job stays off stable
                # push runs and cannot block a release by itself (#531).
                [ "$REF" != refs/heads/stable ] && agents="$AGENTS"
                # stable publishes the site from release.yml, which builds it there.
                [ "$REF" != refs/heads/stable ] && docs="$DOCS"
              fi
              ;;
            schedule)
              agents=true
              ;;
            workflow_dispatch)
              full=true
              if [ "$OPERATION" != validation ]; then
                run=true run_release=true agents=true docs=true deploy=true
              fi
              if [ "$OPERATION" != checks ]; then
                validate=true web=true rules=true
              fi
              ;;
          esac
          {
            echo "run=$run"
            echo "run_release=$run_release"
            echo "agents=$agents"
            echo "docs=$docs"
            echo "deploy=$deploy"
            echo "validate=$validate"
            echo "web=$web"
            echo "rules=$rules"
            echo "full=$full"
          } | tee -a "$GITHUB_OUTPUT"

  # --- Stage 2: path-gated suites --------------------------------------------

  release-scripts:
    name: Check release scripts
    needs: gate
    if: needs.gate.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run release script tests
        run: python3 scripts/ci/local_ci.py --group release

  dart-checks:
    name: Dart checks
    needs: gate
    if: needs.gate.outputs.run == 'true'
    uses: ./.github/workflows/_reusable-dart-checks.yml
    with:
      force_all: ${{ needs.gate.outputs.full == 'true' }}
      upload_coverage: ${{ needs.gate.outputs.full == 'true' }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Required check: the verdict of `Dart checks`. `always()` so a cancelled or failed
  # suite fails it; a skipped required check run would count as passing.
  check:
    name: Check & Test
    needs: [gate, dart-checks]
    if: ${{ always() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require green Dart checks
        env:
          RESULT: ${{ needs.dart-checks.result }}
        run: |
          echo "Dart checks: $RESULT"
          test "$RESULT" = success

  agents:
    name: Agent system validation
    needs: gate
    if: needs.gate.outputs.agents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate agent CLI
        run: python3 scripts/ci/local_ci.py --group agents
      - name: Exercise declarative workflow lifecycle
        env:
          AGENT_LEDGER_FILE: ${{ runner.temp }}/agent-ledger.jsonl
          AGENT_SESSION_INDEX: ${{ runner.temp }}/sessions.jsonl
          AGENT_KNOWLEDGE_DB: ${{ runner.temp }}/knowledge.sqlite3
        run: |
          cp .agents/ledger.jsonl "$AGENT_LEDGER_FILE"
          report="$RUNNER_TEMP/repository-health.json"
          code=0
          scripts/agents/agentctl workflow run .agents/workflows/repository-health.json > "$report" || code=$?
          cat "$report"
          status="$(jq -r '.status // empty' "$report" 2>/dev/null || true)"
          if [[ "$status" == unavailable ]]; then
            # Not a pass: the lifecycle was not exercised. The notice separates it from a failure.
            echo "::notice title=Repository health unavailable::The workflow could not run, so its health is unverified."
            exit 1
          fi
          if [[ "$code" != 0 || ( "$status" != planned && "$status" != succeeded ) ]]; then
            echo "::error title=Repository health failed::status=${status:-unreadable}, exit code=${code}"
            exit 1
          fi
          test -s "$AGENT_LEDGER_FILE"
      - name: Check generated state is ignored
        run: test -z "$(git status --porcelain)"

  docs:
    name: Build documentation
    needs: gate
    if: needs.gate.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/docs/requirements.txt
      - name: Install documentation tools
        run: python -m pip install -r scripts/docs/requirements.txt
      - name: Build and check documentation
        env:
          LOCAL_CI_PYTHON: python
        run: python scripts/ci/local_ci.py --group docs
      - name: Record provenance
        if: ${{ !cancelled() }}
        uses: ./.github/actions/provenance
        with:
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          pr: ${{ github.event.pull_request.number }}

  # Deployment levels (ADR 0005, specs/deployment-levels.md): validate
  # deploy/ manifests and test packages/foodsavr_deploy. The scheduled usage poll is
  # the deployment-poll operation of ops-maintenance.yml.
  deploy-levels:
    name: Validate manifests and test levels CLI
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Instance state: the repository is stateless (ADR 0008); the levels CLI
      # merges this overlay over deploy/instance.yaml. Unset on a fresh fork.
      DEPLOY_INSTANCE: ${{ vars.DEPLOY_INSTANCE }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-levels-check

  # --- Stage 3: Validation ----------------------------------------------------

  changes:
    name: Detect changed areas
    needs: gate
    if: needs.gate.outputs.validate == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.decide.outputs.web }}
      rules: ${{ steps.decide.outputs.rules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') || startsWith(github.ref, 'refs/heads/merge-train/')) && 0 || 1 }}
      - name: Post pending Validation result (start)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: python3 scripts/ci/validation_status.py start
      - name: Fetch develop base for speculative train diff
        if: startsWith(github.ref, 'refs/heads/merge-train/')
        run: git fetch --no-tags origin develop:refs/heads/develop
      - name: Skip if merged tree or unchanged target already validated
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/already_tested.sh --push-only-reuse \
            --require-job 'Validation status \(result\)' \
            --substantive-job '(^| / )(Web smoke test|Web full E2E|Android smoke test|Firestore security rules)$' \
            --target 'web:lib,packages,web,assets,pubspec.yaml,pubspec.lock,test/e2e,.github/workflows/_reusable-web-playwright.yml' \
            --target 'rules:firestore-rules,firestore.rules,.github/workflows/_reusable-web-playwright.yml' \
            pull-request.yml lib packages web assets test/e2e \
            firestore-rules firestore.rules pubspec.yaml pubspec.lock \
            .github/workflows/_reusable-web-playwright.yml
      - name: Classify Dependabot pubspec bump
        id: dep
        if: >
          steps.tested.outputs.skip != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" 2>/dev/null ||
            git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
          python3 scripts/ci/dep_impact.py --base "origin/${{ github.base_ref }}"
      - name: Decide validation targets
        id: decide
        env:
          SKIP: ${{ steps.tested.outputs.skip }}
          SKIP_WEB: ${{ steps.tested.outputs.skip_web }}
          SKIP_RULES: ${{ steps.tested.outputs.skip_rules }}
          EVENT_NAME: ${{ github.event_name }}
          NIGHTLY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/daily' }}
          FILTER_WEB: ${{ needs.gate.outputs.web }}
          FILTER_RULES: ${{ needs.gate.outputs.rules }}
          DEP_WEB: ${{ steps.dep.outputs.run_web }}
        run: |
          web=false
          rules=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            web=true
            rules=true
          else
            if [ "$SKIP" != "true" ]; then
              # On PRs dep_impact.py may narrow web to the platforms a dependency bump
              # can affect, and already_tested.sh reuses green per-target runs when a
              # synchronize left that target untouched.
              if [ "$SKIP_WEB" != "true" ] && [ "$FILTER_WEB" = "true" ] && [ "$DEP_WEB" != "false" ]; then
                web=true
              fi
              [ "$SKIP_RULES" != "true" ] && [ "$FILTER_RULES" = "true" ] && rules=true
            fi
            # The nightly run always produces the full web evidence for this SHA.
            [ "$NIGHTLY" = true ] && web=true
          fi
          {
            echo "web=$web"
            echo "rules=$rules"
          } >> "$GITHUB_OUTPUT"

  web-validation:
    name: Web validation
    needs: [gate, changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.rules == 'true'
    uses: ./.github/workflows/_reusable-web-playwright.yml
    with:
      suite: ${{ needs.gate.outputs.full == 'true' && 'full' || 'smoke' }}
      run_web: ${{ needs.changes.outputs.web == 'true' }}
      # Fork PRs skip the rules tests.
      run_rules: ${{ needs.changes.outputs.rules == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

  android-smoke:
    name: Android smoke test
    needs: changes
    # Android checks run only on manual dispatch (`make validate`).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Flutter app
        uses: ./.github/actions/setup-flutter-app
        with:
          flutter-version: "3.47.6"
          dotenv-content: "CI_TEST=1"
          write-dummy-google-services: "true"
      - name: Start Firebase Emulators (background)
        uses: ./.github/actions/start-firebase-emulators
        with:
          mode: start
      - name: Cache Android AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-google_apis-v1
      - name: Build development debug APK
        run: flutter build apk --flavor development --debug --dart-define=EMULATOR_HOST=10.0.2.2
      - name: Wait for Firebase Emulators
        uses: ./.github/actions/start-firebase-emulators
        with:
          mode: wait
      - name: Run Android smoke and integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
          script: |
            bash scripts/ci/android_smoke.sh
            adb reverse tcp:8080 tcp:8080
            adb reverse tcp:9099 tcp:9099
            flutter test integration_test/all_tests.dart --flavor development --no-pub
      - name: Upload emulator screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-visuals
          path: |
            artifacts/android-visuals/
            firebase-emulators.log
          if-no-files-found: warn
          retention-days: 14

  validation-result:
    name: Validation status (result)
    needs: [gate, changes, web-validation, android-smoke]
    # Also after a failed preflight on a run that would have validated, so the status
    # reads failure instead of waiting forever. Label and edit runs never overwrite a
    # real result from their preflight alone.
    if: >-
      !cancelled() &&
      (needs.gate.outputs.validate == 'true' ||
       (needs.gate.result == 'failure' &&
        (github.event_name == 'push' ||
         (github.event_name == 'workflow_dispatch' && inputs.operation != 'checks') ||
         (github.event_name == 'pull_request' &&
          ((github.event.action == 'labeled' && github.event.label.name == 'merge/auto') ||
           (github.event.action != 'labeled' && github.event.action != 'edited' &&
            (contains(github.event.pull_request.labels.*.name, 'merge/auto') ||
             (vars.SELF_MANAGED_MERGE == 'true' && !github.event.pull_request.draft))))))))
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/ci
      - name: Post final Validation result
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/validation_status.py final
