name: Android test APK to Google Drive

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: release
        type: string

permissions:
  contents: read

concurrency:
  group: android-drive-test
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
      FIREBASE_OPTIONS_B64: ${{ secrets.FIREBASE_OPTIONS_B64 }}
      ANDROID_ENV_B64: ${{ secrets.ANDROID_ENV_B64 }}
    steps:
      - name: Check Drive configuration
        run: |
          test -n "$GOOGLE_DRIVE_FOLDER_ID" || { echo '::error::Missing GOOGLE_DRIVE_FOLDER_ID'; exit 1; }
          test -n "$GOOGLE_DRIVE_OAUTH_JSON" || { echo '::error::Missing GOOGLE_DRIVE_OAUTH_JSON'; exit 1; }
          test -n "$FIREBASE_OPTIONS_B64" || { echo '::error::Missing FIREBASE_OPTIONS_B64 for the remote test APK'; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Restore Firebase test configuration
        run: |
          bash scripts/ci/write_firebase_options.sh
          bash scripts/ci/write_android_test_config.sh

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build installable test APK
        run: flutter build apk --flavor production --debug

      - name: Upload APK to Google Drive
        run: python3 scripts/release/upload_drive.py build/app/outputs/flutter-apk/app-production-debug.apk
