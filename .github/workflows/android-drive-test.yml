name: Android test APK to Google Drive

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: android-drive-test
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_OAUTH_JSON: ${{ secrets.GOOGLE_DRIVE_OAUTH_JSON }}
    steps:
      - name: Check Drive configuration
        run: |
          test -n "$GOOGLE_DRIVE_FOLDER_ID" || { echo '::error::Missing GOOGLE_DRIVE_FOLDER_ID'; exit 1; }
          test -n "$GOOGLE_DRIVE_OAUTH_JSON" || { echo '::error::Missing GOOGLE_DRIVE_OAUTH_JSON'; exit 1; }

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Restore existing Firebase test project configuration
        run: |
          test -s lib/firebase_options.dart || { echo '::error::Missing lib/firebase_options.dart'; exit 1; }
          test -s android/app/google-services.json || { echo '::error::Missing android/app/google-services.json'; exit 1; }
          test -s assets/.env || { echo '::error::Missing assets/.env'; exit 1; }

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build installable test APK
        run: flutter build apk --flavor production --debug

      - name: Upload APK to Google Drive
        run: python3 scripts/release/upload_drive.py build/app/outputs/flutter-apk/app-production-debug.apk
