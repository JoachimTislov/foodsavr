name: Synchronize GitHub labels

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted label rules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Synchronize labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            python3 scripts/github/sync_labels.py --repo "${{ github.repository }}" --number "${{ github.event.issue.number }}" --apply
          else
            python3 scripts/github/sync_labels.py --repo "${{ github.repository }}" --number "${{ github.event.pull_request.number }}" --apply
          fi
