<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="LettMat helps you reduce food waste with pantry tracking, expiry alerts, and simpler meal planning.">
  <meta name="application-name" content="LettMat">
  <meta name="theme-color" content="#13c8ec">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#13c8ec">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101f22">

  <!-- iOS & mobile PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LettMat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LettMat</title>
  <link rel="manifest" href="manifest.json">

  <script>
    (function () {
      const THEME_KEYS = [
        'app_theme_mode',
        'flutter.app_theme_mode',
        'flutter.theme_mode',
      ];
      const LIGHT_BG = '#f6f8f8';
      const DARK_BG = '#101f22';

      function readStoredThemeMode() {
        try {
          if (!window.localStorage) return null;
          for (let i = 0; i < THEME_KEYS.length; i++) {
            const raw = window.localStorage.getItem(THEME_KEYS[i]);
            if (raw === null || raw === '') continue;
            let value = raw;
            try {
              const parsed = JSON.parse(raw);
              if (typeof parsed === 'string') {
                value = parsed;
              }
            } catch (_) {}
            const normalized = String(value).trim().toLowerCase();
            if (
              normalized === 'dark' ||
              normalized === 'light' ||
              normalized === 'system'
            ) {
              return normalized;
            }
          }
        } catch (_) {}
        return null;
      }

      function resolveStartupTheme() {
        const stored = readStoredThemeMode();
        if (stored === 'dark') return 'dark';
        if (stored === 'light') return 'light';
        try {
          if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            return 'dark';
          }
        } catch (_) {}
        return 'light';
      }

      const resolved = resolveStartupTheme();
      const isDark = resolved === 'dark';
      const root = document.documentElement;
      root.classList.toggle('dark', isDark);
      root.dataset.theme = resolved;
      root.style.backgroundColor = isDark ? DARK_BG : LIGHT_BG;
      root.style.colorScheme = resolved;

      window.lettmatTheme = {
        resolveStartupTheme: resolveStartupTheme,
        getTheme: function () {
          return document.documentElement.dataset.theme || 'light';
        },
      };
    })();
  </script>

  <style>
    :root {
      --lm-primary: #13c8ec;
      --lm-bg: #f6f8f8;
      --lm-title: #0f172a;
      --lm-subtitle: #64748b;
      --lm-caption: #94a3b8;
      --lm-ring-track: #e2e8f0;
    }

    :root.dark {
      --lm-bg: #101f22;
      --lm-title: #ffffff;
      --lm-subtitle: #94a3b8;
      --lm-caption: #64748b;
      --lm-ring-track: #334155;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--lm-bg);
    }

    #lettmat-startup-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--lm-bg);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity 220ms ease-out;
    }

    #lettmat-startup-loader.lm-loader-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .lm-loader-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .lm-loader-badge {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background-color: var(--lm-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lm-loader-brand {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .lm-loader-title {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--lm-title);
    }

    .lm-loader-subtitle {
      margin: 0;
      font-size: 14px;
      line-height: 20px;
      font-weight: 500;
      color: var(--lm-subtitle);
    }

    .lm-loader-progress {
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .lm-loader-ring {
      width: 32px;
      height: 32px;
      box-sizing: border-box;
      border-radius: 9999px;
      border: 3px solid var(--lm-ring-track);
      border-top-color: var(--lm-primary);
      animation: lm-spin 1s linear infinite;
    }

    @keyframes lm-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #lettmat-startup-loader {
        transition: none;
      }
      .lm-loader-ring {
        animation: none;
      }
    }
  </style>

  <script>
    (function () {
      let deferredPrompt = null;
      let installedFlag = false;

      function checkStandalone() {
        if (installedFlag) return true;
        try {
          if (window.navigator && window.navigator.standalone === true) {
            return true;
          }
          if (window.matchMedia) {
            if (
              window.matchMedia('(display-mode: standalone)').matches ||
              window.matchMedia('(display-mode: window-controls-overlay)').matches ||
              window.matchMedia('(display-mode: fullscreen)').matches
            ) {
              return true;
            }
          }
        } catch (_) {}
        return false;
      }

      function detectPlatformHint(uaOverride, platformOverride, maxTouchPointsOverride) {
        try {
          const ua =
            typeof uaOverride === 'string'
              ? uaOverride
              : (window.navigator && window.navigator.userAgent) || '';
          const platform =
            typeof platformOverride === 'string'
              ? platformOverride
              : (window.navigator && window.navigator.platform) || '';
          const maxTouchPoints =
            typeof maxTouchPointsOverride === 'number'
              ? maxTouchPointsOverride
              : (window.navigator && window.navigator.maxTouchPoints) || 0;
          const isIOS =
            /iPad|iPhone|iPod/.test(ua) ||
            (platform === 'MacIntel' && maxTouchPoints > 1);
          if (isIOS) return 'ios';
          const isFirefox = /Firefox\//i.test(ua) && !/Seamonkey\//i.test(ua);
          if (isFirefox) {
            return /Android/i.test(ua) ? 'firefox-android' : 'firefox-desktop';
          }
          const isSafari =
            /^((?!chrome|android|crios|fxios|edgios).)*safari/i.test(ua);
          if (isSafari) return 'macos-safari';
        } catch (_) {}
        return 'standard';
      }

      function notifyStateChange() {
        try {
          window.dispatchEvent(new CustomEvent('foodsavr:pwa-state'));
        } catch (_) {}
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        notifyStateChange();
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        installedFlag = true;
        notifyStateChange();
      });

      try {
        if (window.matchMedia) {
          const mql = window.matchMedia('(display-mode: standalone)');
          if (mql && typeof mql.addEventListener === 'function') {
            mql.addEventListener('change', notifyStateChange);
          }
        }
      } catch (_) {}

      window.foodsavrPwa = {
        isInstalled: function () {
          return checkStandalone();
        },
        canPrompt: function () {
          return Boolean(deferredPrompt) && !checkStandalone();
        },
        platformHint: function () {
          return detectPlatformHint();
        },
        detectPlatformHint: detectPlatformHint,
        promptInstall: async function () {
          if (!deferredPrompt) return 'unavailable';
          const promptEvent = deferredPrompt;
          deferredPrompt = null;
          try {
            await promptEvent.prompt();
            const choice = await promptEvent.userChoice;
            const outcome =
              choice && choice.outcome === 'accepted' ? 'accepted' : 'dismissed';
            if (outcome === 'accepted') {
              installedFlag = true;
            }
            notifyStateChange();
            return outcome;
          } catch (_) {
            notifyStateChange();
            return 'dismissed';
          }
        },
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    })();
  </script>
  <script>
    (function () {
      const MAX_EARLY_ERRORS = 20;
      const MAX_PREBOOT_DISPATCH = 5;
      const buffer = [];
      let dispatched = 0;

      function isLocalHost() {
        try {
          const host = (window.location && window.location.hostname) || '';
          return host === 'localhost' || host === '127.0.0.1' || host === '[::1]';
        } catch (_) {
          return true;
        }
      }

      function serializeError(errorType, message, stack, source) {
        return {
          error_type: String(errorType || 'Error').slice(0, 120),
          message: String(message || 'Unknown error').slice(0, 500),
          stack: String(stack || '').slice(0, 2000),
          source: String(source || 'web-preboot').slice(0, 120),
          url: String((window.location && window.location.href) || '').slice(0, 300),
          occurred_at: new Date().toISOString(),
        };
      }

      function maybeDispatchPreboot(entry) {
        try {
          if (isLocalHost() || dispatched >= MAX_PREBOOT_DISPATCH) return;
          const cfg = window.foodsavrMonitoringConfig;
          if (!cfg || !cfg.mode || cfg.mode === 'none') return;

          if (cfg.mode === 'external' && typeof cfg.endpoint === 'string' && cfg.endpoint.startsWith('https://')) {
            dispatched += 1;
            const body = JSON.stringify({
              source: 'web-preboot',
              platform: 'web',
              environment: cfg.environment || 'production',
              deployment_level: cfg.deploymentLevel || 'firebase-spark',
              error_type: entry.error_type,
              message: entry.message,
              stack: entry.stack,
              url: entry.url,
              occurred_at: entry.occurred_at,
            });
            if (navigator.sendBeacon) {
              navigator.sendBeacon(cfg.endpoint, new Blob([body], { type: 'application/json' }));
            } else if (window.fetch) {
              window.fetch(cfg.endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: body,
                keepalive: true,
              }).catch(function () {});
            }
          } else if (
            cfg.mode === 'spark-firestore' &&
            typeof cfg.projectId === 'string' &&
            cfg.projectId &&
            typeof cfg.apiKey === 'string' &&
            cfg.apiKey &&
            window.fetch
          ) {
            dispatched += 1;
            const endpoint =
              'https://firestore.googleapis.com/v1/projects/' +
              encodeURIComponent(cfg.projectId) +
              '/databases/(default)/documents/runtime_errors?key=' +
              encodeURIComponent(cfg.apiKey);
            const firestoreBody = JSON.stringify({
              fields: {
                status: { stringValue: 'new' },
                platform: { stringValue: 'web' },
                environment: { stringValue: String(cfg.environment || 'production') },
                deployment_level: { stringValue: 'firebase-spark' },
                error_type: { stringValue: entry.error_type },
                message: { stringValue: entry.message },
                url: { stringValue: entry.url },
                occurred_at: { stringValue: entry.occurred_at },
                stack: { stringValue: entry.stack },
              },
            });
            window.fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: firestoreBody,
              keepalive: true,
            }).catch(function () {});
          }
        } catch (_) {}
      }

      function recordEarlyError(entry) {
        try {
          if (buffer.length < MAX_EARLY_ERRORS) {
            buffer.push(entry);
          }
          maybeDispatchPreboot(entry);
        } catch (_) {}
      }

      window.__foodsavrEarlyErrors = buffer;
      window.foodsavrMonitoring = {
        getEarlyErrors: function () {
          return buffer.slice();
        },
        clearEarlyErrors: function () {
          buffer.length = 0;
        },
      };

      window.addEventListener('error', function (event) {
        try {
          const err = event && event.error;
          const name = (err && err.name) || 'WindowError';
          const msg = (err && err.message) || (event && event.message) || 'Script error';
          const stack = (err && err.stack) || (event && event.filename ? event.filename + ':' + event.lineno + ':' + event.colno : '');
          recordEarlyError(serializeError(name, msg, stack, 'window.error'));
        } catch (_) {}
      });

      window.addEventListener('unhandledrejection', function (event) {
        try {
          const reason = event && event.reason;
          const name = (reason && reason.name) || 'UnhandledRejection';
          const msg = (reason && reason.message) || (typeof reason === 'string' ? reason : 'Unhandled promise rejection');
          const stack = (reason && reason.stack) || '';
          recordEarlyError(serializeError(name, msg, stack, 'window.unhandledrejection'));
        } catch (_) {}
      });
    })();
  </script>
</head>
<body>
  <div
    id="lettmat-startup-loader"
    role="status"
    aria-live="polite"
    aria-label="Loading LettMat"
  >
    <div class="lm-loader-stack">
      <div class="lm-loader-badge" aria-hidden="true">
        <svg
          width="40"
          height="40"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M6.05 8.05c-2.73 2.73-2.73 7.15-.02 9.88 1.47-3.4 4.09-6.24 7.36-7.93-2.77 2.34-4.71 5.61-5.39 9.32 2.6 1.23 5.8.78 7.95-1.37C19.43 14.47 20 4 20 4S9.53 4.57 6.05 8.05z"
            fill="#0f172a"
          />
        </svg>
      </div>
      <div class="lm-loader-brand">
        <h1 class="lm-loader-title">LettMat</h1>
        <p class="lm-loader-subtitle">Less waste, easier meals.</p>
      </div>
      <div class="lm-loader-progress">
        <div class="lm-loader-ring" aria-hidden="true"></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      let dismissed = false;
      let observer = null;

      function dismissStartupLoader() {
        if (dismissed) return;
        dismissed = true;
        if (observer) {
          try {
            observer.disconnect();
          } catch (_) {}
          observer = null;
        }
        const loader = document.getElementById('lettmat-startup-loader');
        if (!loader) return;
        loader.classList.add('lm-loader-hidden');
        const reducedMotion =
          window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reducedMotion) {
          loader.remove();
        } else {
          window.setTimeout(function () {
            if (loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 260);
        }
      }

      window.lettmatDismissStartupLoader = dismissStartupLoader;
      window.addEventListener('flutter-first-frame', dismissStartupLoader, {
        once: true,
      });

      if (typeof MutationObserver === 'function' && document.body) {
        observer = new MutationObserver(function () {
          if (document.querySelector('flutter-view, flt-glass-pane')) {
            window.requestAnimationFrame(function () {
              dismissStartupLoader();
            });
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
