site_name: FoodSavr
site_description: Reduce food waste, save time, and make groceries easier to manage.
site_url: https://joachimtislov.github.io/foodsavr/
repo_url: https://github.com/JoachimTislov/foodsavr
repo_name: JoachimTislov/foodsavr
docs_dir: build/docs-source
site_dir: build/docs-site
use_directory_urls: true
hooks:
  - scripts/docs/hooks.py
theme:
  name: material
  logo: assets/logos/foodsavr-logo.svg
  favicon: assets/logos/foodsavr-logo.svg
  font: false
  palette:
    primary: teal
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - fenced_code
nav:
  - The vision: index.md
  - Specification:
      - Start here: specs/INDEX.md
      - Architecture: specs/architecture.md
      - Data model: specs/data-model.md
      - Ingestion pipeline: specs/ingestion-pipeline.md
      - Integrations: specs/integrations.md
      - MCP server: specs/mcp-server.md
      - Quality and testing: specs/qa-testing.md
      - CI and publishing: specs/ci-workflows.md
      - Agent system: specs/agent-system.md
      - Implementation status: specs/status.md
      - Decisions:
          - Source-of-truth sync: specs/decisions/0001-source-of-truth-sync-loop.md
          - Intent and verification: specs/decisions/0002-intent-gated-specs-optimized-verification.md
          - Agent execution: specs/decisions/0003-autonomous-execution-boundary.md
          - Authoritative shapes: specs/decisions/0004-truth-in-shapes.md
          - Automated integration: specs/decisions/0006-automated-integration-of-revertable-changes.md
          - Develop and fast-forward deploy: specs/decisions/0007-develop-integration-branch-and-fast-forward-deploy.md
          - Human docs scope: specs/decisions/0011-human-docs-cover-manual-processes-only.md
  - Contributor guides:
      - For humans: doc/humans.md
      - Test strategy: doc/test-strategy.md
      - Contributing: CONTRIBUTING.md
      - Coding standards: coding-standards.md
  - Project:
      - Readme: project-overview.md
      - Documentation index: INDEX.md
      - Roadmap: TODO.md
